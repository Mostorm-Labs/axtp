id: castcontrol.c10_legacy
title: P0 c10 legacy
since: spec/v0.18.0
level: cast-control
profiles:
  - cast-control
  - websocket-jsonrpc
given:
  device_profile: cast_control_receiver
  oracle: reference/cast-control.mjs
  source: specs/45-cast-control.md
scenarios:
  - name: old_projection
    given:
      client_axtp_version: 1.0.0
    steps:
      - id: legacy
        direction: runtime_local
        control_model:
          action: legacy_projection
          input: {}
          expect:
            result:
              receiver:
                role: receiver
                protocols:
                  - hid
                  - airplay
                state: ready
                receiverPhase: rendering
              sampledAt: 2026-10-20T08:00:00Z
              session:
                sessionId: legacy-session
                protocol: hid
                receiverPhase: rendering
            sequenceParticipates: false
      - id: v1
        direction: runtime_local
        control_model:
          action: capture
          input:
            controlVersion: 1
          expect:
            status: SUCCESS
      - id: legacy_again
        direction: runtime_local
        control_model:
          action: legacy_projection
          input: {}
          expect:
            result:
              receiver:
                role: receiver
                protocols:
                  - hid
                  - airplay
                state: ready
                receiverPhase: rendering
              sampledAt: 2026-10-20T08:00:00Z
              session:
                sessionId: legacy-session
                protocol: hid
                receiverPhase: rendering
    assertions:
      - The observable result matches specs/45-cast-control.md.
  - name: unknown_optional
    given:
      client_axtp_version: 1.0.0
    steps:
      - id: value
        direction: runtime_local
        control_model:
          action: validate_value
          input:
            schema: CastSessionRef
            value:
              id: session-hid
              generation: "9007199254740993"
              futureOptional: 123
          expect:
            valid: true
    assertions:
      - The observable result matches specs/45-cast-control.md.
  - name: legacy_event_not_sequenced
    given:
      client_axtp_version: 1.0.0
    steps:
      - id: install
        direction: runtime_local
        control_model:
          action: install_snapshot
          input: {}
          expect:
            installed: true
      - id: window
        direction: runtime_local
        control_model:
          action: receive_event
          input:
            event:
              name: cast.windowChanged
              data:
                changedFields:
                  - visible
                state:
                  hasWindow: true
                  visible: true
                  mode: normal
                  fullscreen: false
                  alwaysOnTop: false
          expect:
            ignored: true
      - id: new
        direction: runtime_local
        control_model:
          action: receive_event
          input:
            event:
              name: cast.receiversChanged
              data:
                context:
                  controlVersion: 1
                  runtimeInstanceId: 11111111-1111-4111-8111-111111111111
                  revision: "2"
                  eventSequence: "1"
                  batchId: "1"
                  partIndex: 0
                  partCount: 1
                receivers:
                  - receiverId: receiver-hid
                    protocol: hid
                    state: ready
                    observedAt: 2026-10-20T08:00:00Z
                  - receiverId: receiver-airplay
                    protocol: airplay
                    state: ready
                    observedAt: 2026-10-20T08:00:00Z
                  - receiverId: receiver-webcast
                    protocol: webcast
                    state: ready
                    observedAt: 2026-10-20T08:00:00Z
          expect:
            applied: true
            eventSequence: "1"
    assertions:
      - The observable result matches specs/45-cast-control.md.
