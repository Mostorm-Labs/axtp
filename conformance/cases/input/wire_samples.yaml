id: input.wire_samples
title: Full Frame Touch 7xN and all Mouse variants preserve samples and reject malformed lifecycles
since: spec/v0.18.0
level: typed-input
profiles: [typed-input, framed-binary]
given: {device_profile: typed_input, transport: standard_frame}
steps:
  - direction: runtime_local
    input_model:
      action: vectors
      input: {file: contract/test-vectors/input_stream.json}
      expect: {positiveFrames: 25, negativeCases: 13}
assertions:
  - All generated bytes execute through exact framing, CRC, record and context validation.
  - Mixed input does not reset the other type and terminal contacts remain in their original sample.
