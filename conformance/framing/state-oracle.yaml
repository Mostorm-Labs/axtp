version: 0.1.0
scope: test-adapter-observable framing state; not a production runtime API

observable_events:
  - id: effective_params
    meaning: Resolved Framed Link values after OPEN and ACCEPT presence/override processing.
  - id: dispatch
    meaning: One complete logical CONTROL, RPC, or STREAM payload crossed the Frame layer boundary.
  - id: control_emission
    meaning: A CONTROL semantic response was emitted; frame MessageId allocation is intentionally not compared.
  - id: context_outcome
    meaning: Test-harness view of reassembly lifecycle outcome without exposing runtime container/thread internals.
  - id: local_reject
    meaning: Sender or local framing operation rejected an impossible/invalid action before emitting invalid wire bytes.
  - id: diagnostic
    meaning: Optional local frame diagnostic classification.
    conditional_capability: frame_diagnostics
  - id: policy_probe
    meaning: Adapter-provided evidence that a runtime-owned resource/time policy exists and is finite where required.
    conditional_capability: resource_probe

context_outcomes:
  - partial
  - completed
  - invalidated
  - abandoned_missing
  - expired
  - resource_exhausted
  - cleared

rules:
  - Only peer-visible framing results and explicit test-adapter observations are compared across implementations.
  - A production runtime is not required to expose the state-oracle API; an adapter may provide test-only hooks.
  - Threading, allocator choice, buffer/container layout, retry loops, scheduler topology, and reconnect state are never oracle fields.
  - No upper-layer dispatch is permitted before a fragmented logical message is complete.
  - Diagnostic events are compared only when the adapter advertises frame_diagnostics.
  - A control_emission comparison fixes opcode/controlId/status semantics but does not fix the sender's Frame MessageId allocation sequence.
