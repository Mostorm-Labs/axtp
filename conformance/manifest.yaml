conformance:
  version: 0.1.0
  spec_min: spec/v0.0.2

levels:
  core:
    description: Required minimum AXTP RPC and registry behavior for all runtimes.
    required_cases:
      - rpc.request_response_json
      - rpc.method_not_found
      - rpc.request_id_match
      - rpc.invalid_params
      - error.standard_error_shape

  capability:
    description: Default-runtime registry and capability behavior. Catalog-only draft cases are not release-required.
    required_cases:
      - capability.get_all
      - capability.method_binding
      - capability.unsupported_method
      - capability.registered_method_not_supported
      - capability.session_survives_not_supported
      - capability.unknown_optional_field_ignored
      - capability.known_optional_feature_not_supported

  event:
    description: RPC event decode/encode behavior.
    required_cases:
      - event.subscribe_event
      - event.unsubscribe_event
      - event.emit_event
      - event.unknown_event_ignored
      - event.unsupported_capability_not_emitted

  endpoint-relay:
    description: Optional object-RPC endpoint addressing and transparent relay behavior using m.src/m.dst.
    required_cases:
      - rpc.endpoint_metadata_compatibility
      - rpc.endpoint_relay_addressing
      - event.endpoint_fanout_addressing

  stream:
    description: Standard Framed STREAM data-plane behavior backed by the default runtime contract. Draft business lifecycle cases remain catalog-only until adopted.
    required_cases:
      - stream.stream_data

  websocket-jsonrpc:
    description: WebSocket unframed JSON RPC behavior.
    required_cases:
      - session.hello_identify_identified
      - session.axtp_version_advisory
      - session.request_before_identified
      - rpc.request_response_json
      - rpc.method_not_found
      - rpc.request_id_match

  framed-binary:
    description: Standard framed CONTROL and RPC behavior. STREAM is validated by the separate stream scope.
    required_cases:
      - handshake.open_accept
      - handshake.close
      - handshake.heartbeat
      - rpc.request_id_match
