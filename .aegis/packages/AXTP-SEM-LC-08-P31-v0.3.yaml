mechanism_binding_contract:
  invalid_ref:
    requirement: >-
      Consume the canonical missing semantic/projection references through
      real ProtocolAdoptionGuard semantic/projection validation. Generic
      INVALID_OPERATION from openCase(null) is forbidden as proof.

  projection_gap:
    requirement: >-
      Use a real SEMANTIC_DELTA adoption path whose missing/incomplete
      projection causes the production projection-required or lineage
      invariant to reject. NO_DELTA substitution is forbidden.

  candidate_leak:
    requirement: >-
      Exercise the concrete internal Git Registry Protocol Authority writer
      with the canonical candidate-shaped payload as the attempted Protocol
      Authority mutation payload. Production Registry prospective-mutation
      validation must reject it before target/correlation refs change.
      Public/workflow access to the writer must remain forbidden.

  stale_basis:
    requirement: >-
      Preserve the already mechanism-consistent real prospective-basis
      mismatch producing the stale-basis rejection.

  commit_interruption:
    requirement: >-
      Use real ProtocolAdoptionGuard plus
      GitRegistryProtocolAuthorityMutationPort with controlled
      afterRefTransaction interruption. Observe AMBIGUOUS_PROTOCOL_COMMIT,
      atomic target/correlation ref state, durable unresolved reservation,
      APPLIED_EXACT reconciliation, and zero duplicate Registry commit.

  idempotency_collision:
    requirement: >-
      Use the two non-identical canonical mutation digests with the real Git
      writer correlation identity. First application may succeed; second
      mutation must resolve APPLIED_CONFLICT /
      PROTOCOL_ADOPTION_OUTCOME_CONFLICT and must not create a duplicate
      Registry commit.

classification_rule: >-
  The frozen classification label may be emitted only after the specified
  canonical fault was actually consumed by the specified production
  mechanism and the actual production error/outcome was observed.
  Unknown or unrelated production exceptions fail closed.

