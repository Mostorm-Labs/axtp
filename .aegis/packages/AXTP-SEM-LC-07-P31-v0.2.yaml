tests:
  required:
    - id: W7-1
      oracle: Stage10 classification plus exact freshness; unresolved or stale Stage20 entry count equals zero
    - id: W7-2
      oracle: workflow cannot synthesize Candidate, HUMAN review, or Semantic Authority and semantic-delta draft requires current accepted projection basis
    - id: W7-3
      oracle: BOUND_EXISTING delegates without reinterpretation or Protocol mutation
    - id: W7-4
      oracle: production guarded Registry mutation and reconciliation
      cases:
        - raw writer absent from public surface
        - only production composition constructs/imports GitRegistryProtocolAuthorityMutationPort
        - Stage30 and Stage40 contain no Authority publication bypass
        - positive path in temporary real Git repository commits exact prospective Registry bytes and returns exact commit/tree
        - prospective snapshot change after selection cannot alter committed bytes
        - target-ref head drift before ref transaction yields zero stale adoption commit
        - direct Registry commit bypass is rejected by architecture oracle
        - response loss after atomic ref transaction reconciles APPLIED_EXACT and creates no second commit
        - pre-transaction failure has no applied correlation ref and reconciles NOT_APPLIED
        - correlation conflict never performs a second mutation
        - working-tree Registry bytes differing from exact prospective payload fail closed
        - dirty index fails closed
    - id: W7-5
      oracle: Stage40 semantic delta requires superseding Semantic Authority and finalizes through same guarded production Registry writer
    - id: W7-6
      oracle: Stage50 rejects staged or unstaged Registry drift; Stage99 owns no writer/lifecycle truth; stage numbers remain 10/20/30/40/50/99
    - id: predecessor_semantic_lifecycle_regression
      oracle: all existing tooling/semantic-lifecycle tests pass
    - id: generator_current_source_regression
      oracle: generator build/test/validate:sources pass without Registry source mutation
  zero_tolerance:
    unguarded_protocol_authority_mutation_total: 0
    post_guard_drift_acceptance_total: 0
    machine_only_adoption_authorization_total: 0
    unauthorized_protocol_writer_edges: 0
    registry_payload_mutable_reread_total: 0
    protocol_ref_transaction_split_total: 0
    reconcile_duplicate_registry_commit_total: 0

