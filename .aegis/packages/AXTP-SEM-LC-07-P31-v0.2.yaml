production_protocol_authority:
  adopted_machine_truth: committed contract/registry/**/*.yaml
  revision_identity:
    type: git_commit
    trust_identity: exact_commit_sha
    locator_only: explicit_target_ref
    mutable_head_as_trust_identity: forbidden
    resulting_ref_revision: exact_resulting_git_commit_sha
    resulting_ref_digest: contract_registry_tree_digest
  working_tree_registry_state: prospective_non_authoritative

prospective_registry_basis:
  implementation_file: tooling/semantic-lifecycle/src/registryProspectiveProtocolBasisProvider.ts
  storage: git_dir_non_authoritative_staging
  storage_locator: git rev-parse --git-path axtp/prospective-protocol-basis
  payload_kind: AXTP_REGISTRY_MUTATION
  payload_schema:
    schemaVersion: 1
    baseProtocolAuthorityRevision: exact_commit_sha
    writes: sorted_unique_complete_utf8_registry_files_with_sha256
    deletes: sorted_unique_registry_paths
  allowed_paths: contract/registry/**/*.yaml
  immutable_ref:
    namespace: prospective-protocol-basis
    subject: axtp-registry
    revision: canonical_payload_digest
  requirements:
    - same immutable ref must never resolve to different bytes
    - commit payload must use exact snapshot bytes and never reread mutable Registry paths
    - staging must never become a second adopted Protocol truth store

production_mutation_port:
  implementation_file: tooling/semantic-lifecycle/src/gitRegistryProtocolAuthorityMutationPort.ts
  class: GitRegistryProtocolAuthorityMutationPort
  public_export: forbidden
  construction_owner: tooling/semantic-lifecycle/src/productionProtocolAdoptionRuntime.ts
  requirements:
    - require explicit checked-out target ref and exact expected commit SHA
    - require clean Git index before finalization
    - re-resolve target ref at mutation boundary and fail on expected-head drift
    - verify prospective ref, digest, base revision, and Registry-only paths
    - build temporary Git index and tree from exact expected commit plus exact proposal bytes
    - create exactly one Git commit with parent equal to exact expected commit
    - bind caseId operationId commandDigest and prospective basis in deterministic correlation metadata
    - atomically update target ref and refs/axtp/protocol-adoption/<correlation-key> using expected-old-value CAS
    - update checked-out index for Registry paths only after successful ref linearization
    - require working-tree Registry bytes to equal exact proposal at finalization
    - return exact resulting commit and Registry tree identity
  reconciliation:
    NOT_APPLIED: correlation ref absent after atomic transaction boundary
    APPLIED_EXACT: exact correlated commit and lineage match
    APPLIED_CONFLICT: existing correlation has mismatched lineage or digest
    UNKNOWN_OR_UNAVAILABLE: repository/ref/commit state cannot be safely resolved
    duplicate_commit_after_response_loss: forbidden

production_composition:
  implementation_file: tooling/semantic-lifecycle/src/productionProtocolAdoptionRuntime.ts
  required_edge:
    - Stage30_or_Stage40_workflow
    - production_Protocol_adoption_composition
    - ProtocolAdoptionRoute.finalizeProtocolAdoption
    - ProtocolAdoptionGuard
    - GitRegistryProtocolAuthorityMutationPort
    - atomic_Git_ref_transaction
    - committed_contract_registry_Authority
  forbidden_edges:
    - WorkflowLifecycleAdapter_to_ProtocolAuthorityMutationPort
    - Stage30_or_Stage40_to_raw_GitRegistryProtocolAuthorityMutationPort
    - Stage30_or_Stage40_direct_registry_git_commit_outside_Guard
    - detached_Guard_check_then_direct_apply_patch_or_commit

stage_contract:
  stage10: classify first; unresolved or stale fails closed before Stage20
  stage20: proposal/review only; may prepare immutable prospective Registry basis; no adoption
  stage30: >-
    working-tree YAML edits are prospective staging only; final adoption must use the guarded
    production composition; direct Registry Authority git commit is forbidden
  stage40: >-
    reclassify first; true semantic delta requires accepted superseding Semantic Authority;
    final Protocol mutation uses the same guarded production Registry writer
  stage50: >-
    derived-only generation from committed Registry source; staged or unstaged
    contract/registry drift at generation time is forbidden
  stage99: lifecycle-aware routing only; no copied lifecycle truth or writer capability

