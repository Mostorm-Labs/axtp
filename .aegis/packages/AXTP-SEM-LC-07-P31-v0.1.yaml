    - exact result revision and tree
    - package_ref
    - test and oracle IDs
    - owned machine facts only
  manifest_requirements:
    - bind all six boundary reports
    - bind provider run attempt job and artifact refs
  reviewer_accessible_materialization_required: true
  local_only_result_sufficient: false
  supporting_only:
    - duplicate logs
    - duplicate archives
    - RED/GREEN transcripts unless independently needed
    - prose traceability matrices

execution_closure_contract:
  required_changes:
    - RC7-01
    - RC7-02
    - RC7-03
    - RC7-04
    - RC7-05
    - RC7-06
    - RC7-07
    - RC7-08
    - RC7-09
  forbidden_changes:
    - any path outside exact authorized scope
    - direct Protocol Authority mutation outside Guard -> MutationPort
    - second lifecycle implementation in workflow layer
    - modification of accepted predecessor lifecycle implementation files
    - stage renumbering or unrelated Skill/workflow redesign
    - new semantic or Protocol truth store
  required_tests_or_oracles:
    - W7-1
    - W7-2
    - W7-3
    - W7-4
    - W7-5
    - W7-6
    - predecessor semantic-lifecycle regression
  hosted_verification: required
  blocking_evidence:
    - six owned workflow-boundary reports
    - exact package and scope binding
    - exact result revision and tree
    - production-selected Stage30 writer-edge proof
  corroborative_only:
    - duplicate logs and archives
    - RED/GREEN transcripts unless independently needed
    - prose traceability matrices
  terminal_success_condition: >-
    Exact package preflight succeeds; all RC7 changes remain inside scope; W7-1 through
    W7-6 and predecessor regression pass; all zero-tolerance counters remain zero; the
    actual Stage30 Authority-changing writer path is demonstrably linearized inside
    ProtocolAdoptionGuard -> ProtocolAuthorityMutationPort; seven exact-result evidence
    files are materialized and uploaded from the exact result revision; no official P34
    verdict is emitted.
  explicit_blockers:
    BLOCKED_REPOSITORY_IDENTITY: repository or ancestry cannot be established
    BLOCKED_AUTHORITY: package or Authority binding conflict or required upstream decision missing
    BLOCKED_SCOPE: implementation requires an unlisted path or broader redesign
    BLOCKED_PREDECESSOR_DEFECT: accepted predecessor lifecycle implementation must change
    BLOCKED_IMPLEMENTATION: workflow enforcement or actual Protocol Authority bridge unavailable
    BLOCKED_VERIFICATION: required W7 oracle cannot be made failure-sensitive
    BLOCKED_EVIDENCE: reviewer-accessible exact-result evidence cannot be materialized
  continue_until_terminal_state: true

non_goals:
