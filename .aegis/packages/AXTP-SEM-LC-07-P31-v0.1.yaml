  scope_extension_rule: >-
    If another implementation path is required, P32 must stop with BLOCKED_SCOPE and
    request a P31 addendum. It may not extend this list itself.
  predecessor_defect_rule: >-
    If a read-only predecessor lifecycle file must change, return
    BLOCKED_PREDECESSOR_DEFECT and route by root cause rather than repairing it inside SEM-LC-07.

required_changes:
  - id: RC7-01
    requirement: Add stateless WorkflowLifecycleAdapter with the frozen delegation/ownership contract.
  - id: RC7-02
    requirement: Stage10 gap routing classifies first and fails closed on unresolved or stale classification.
  - id: RC7-03
    requirement: >-
      Stage20 distinguishes non-authoritative proposal from Product Semantic Authority;
      SEMANTIC_DELTA draft input binds exact accepted current Semantic Authority projection basis.
  - id: RC7-04
    requirement: >-
      Stage30 has no Authority-changing Protocol mutation path outside
      ProtocolAdoptionRoute.finalizeProtocolAdoption -> ProtocolAdoptionGuard -> ProtocolAuthorityMutationPort.
  - id: RC7-05
    requirement: >-
      Stage40 reclassifies first; true semantic delta requires a new accepted superseding
      Semantic Authority before Protocol amendment/adoption.
  - id: RC7-06
    requirement: Stage50 remains machine-evidence and derived-generation only.
  - id: RC7-07
    requirement: Stage99 routes to lifecycle-aware boundaries without copying lifecycle logic.
  - id: RC7-08
    requirement: Preserve stage numbering, Skill count, predecessor semantics, and no second truth store.
  - id: RC7-09
    requirement: >-
      Add deterministic workflow-boundary evidence generation and one SEM-LC-07 job to
      the existing validate-conformance.yml; do not create a new CI workflow.

tests_and_oracles:
  W7-1:
    purpose: Stage10 classification and exact freshness for V1/V2
    cases:
      - no assessment
      - UNRESOLVED
      - stale scope
      - stale classification basis
      - valid NO_SEMANTIC_DELTA
      - SEMANTIC_DELTA route
    oracle:
      stage20_without_fresh_classification_total: 0
      unresolved_or_stale_stage20_entry_total: 0
  W7-2:
    purpose: Semantic Authority and proposal boundary for V3/V4/V5/V6/V10
    cases:
      - adapter cannot synthesize Candidate HUMAN review or Authority
      - SEMANTIC_DELTA draft without accepted current projection basis fails
      - accepted SEMANTIC_FIRST projection basis succeeds
      - repair and supersession use predecessor route only
    oracle:
      workflow_created_semantic_truth_total: 0
      machine_created_human_pass_total: 0
      semantic_delta_draft_without_current_authority_total: 0
  W7-3:
    purpose: BOUND_EXISTING no-reinterpretation for V7
    cases:
      - adopted Protocol semantic reconstruction delegates to BoundExistingRoute
      - workflow reinterpretation attempt fails
      - BOUND_EXISTING Protocol mutation attempt fails
    oracle:
      workflow_bound_existing_reinterpretation_total: 0
      bound_existing_protocol_mutation_total: 0
  W7-4:
    purpose: Stage30 guarded Protocol mutation for V8/V9/V10
    cases:
      - direct Stage30 writer path rejected
      - exact guard finalization path succeeds
      - stale Assessment Semantic Authority prospective basis and Protocol head fail
      - machine PASS without HUMAN Projection Review fails
      - production writer edge is Guard to MutationPort only
    oracle:
      unguarded_protocol_authority_mutation_total: 0
      post_guard_drift_acceptance_total: 0
      machine_only_adoption_authorization_total: 0
      unauthorized_protocol_writer_edges: 0
  W7-5:
    purpose: Stage40 supersession before amendment
    cases:
      - NO_DELTA reclassification path
      - SEMANTIC_DELTA without superseding Authority blocked
      - accepted new Authority exact basis permits amendment path
      - stale prior Authority cannot authorize amendment
    oracle:
      semantic_delta_amendment_without_supersession_total: 0
      stale_semantic_authority_amendment_total: 0
  W7-6:
    purpose: Stage50 and Stage99 architecture boundary
    cases:
      - Stage50 cannot own semantic truth review or adoption
      - Stage99 cannot bypass adapter or create lifecycle logic
      - exact six Skill surfaces contain lifecycle boundary clauses
      - stage numbers remain 10 20 30 40 50 99
    oracle:
      generator_semantic_truth_edges: 0
      workflow_router_bypass_edges: 0
      stage_renumbering_total: 0
      unauthorized_skill_surface_changes_total: 0
  regression:
    - all existing tooling/semantic-lifecycle predecessor tests remain green

verification_commands:
  - corepack enable
  - corepack prepare pnpm@11.3.0 --activate
  - pnpm --dir tooling/semantic-lifecycle install --lockfile=false
  - pnpm --dir tooling/semantic-lifecycle build
  - pnpm --dir tooling/semantic-lifecycle lint
  - pnpm --dir tooling/semantic-lifecycle test
  - pnpm --dir tooling/semantic-lifecycle evidence:workflow-lifecycle
  - git diff --check

