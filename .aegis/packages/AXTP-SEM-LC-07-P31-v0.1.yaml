verification:
  gate: VG-SM-07_WORKFLOW_LIFECYCLE_ENFORCEMENT
  obligation: END_TO_END_V1_V10_AT_WORKFLOW_BOUNDARIES
  sem_lc_06_p20_scope_note: >-
    SEM-LC-06 P20 is V8/V9/V10-specific and is not the full SEM-LC-07
    verification contract. SEM-LC-07 inherits the accepted upstream P20 obligation
    plus predecessor gates required for V1-V10 workflow enforcement.
  blocking_evidence_policy: >-
    Evidence is blocking only when its absence leaves a high-impact failure mode
    without credible independent detection coverage.

implementation_mechanism:
  component: WorkflowLifecycleAdapter
  placement: tooling/semantic-lifecycle/src/workflowLifecycleAdapter.ts
  ownership:
    persistent_state: none
    product_semantic_truth: forbidden
    human_review_creation: forbidden
    semantic_authority_ownership: forbidden
    protocol_authority_ownership: forbidden
    direct_protocol_mutation_capability: forbidden
  accepted_high_level_dependencies:
    - SemanticLifecycleCoordinator
    - SemanticFirstRoute
    - BoundExistingRoute
    - ProtocolAdoptionRoute
    - ProtocolAdoptionGuard_indirect_via_ProtocolAdoptionRoute
  exact_delegation:
    stage10:
      call: SemanticLifecycleCoordinator.assess
      rules:
        - UNRESOLVED fails closed before Stage20
        - NO_SEMANTIC_DELTA continues only with exact freshness
        - SEMANTIC_DELTA enters accepted SEMANTIC_FIRST lifecycle before Stage20 projection proposal
    semantic_first:
      owner: SemanticFirstRoute
      rules:
        - adapter may orchestrate externally supplied inputs only
        - adapter cannot manufacture Candidate content or HUMAN review
        - accepted current projection basis comes from SemanticFirstRoute.resolveProjectionBasis
    bound_existing:
      owner: BoundExistingRoute
      rules:
        - adopted Protocol semantic reconstruction delegates to predecessor route
        - workflow-layer reinterpretation is forbidden
        - Protocol mutation from BOUND_EXISTING is forbidden
    stage30:
      owner: ProtocolAdoptionRoute
      finalization_call: ProtocolAdoptionRoute.finalizeProtocolAdoption
      mutation_chain: ProtocolAdoptionRoute.finalizeProtocolAdoption -> ProtocolAdoptionGuard -> ProtocolAuthorityMutationPort
      direct_mutation_from_workflow: forbidden
    stage40:
      first_call: SemanticLifecycleCoordinator.assess
      true_delta_requirement: >-
        A new SEMANTIC_FIRST case must complete SemanticFirstRoute.commitSupersedingAuthority
        before Protocol amendment/adoption may continue.
    stage50:
      role: derived_artifact_generation_and_machine_evidence_only
    stage99:
      role: lifecycle_aware_router_only

stage30_production_writer_bridge:
  requirement: >-
    The actual Authority-changing Protocol write must linearize only inside
    ProtocolAdoptionGuard -> ProtocolAuthorityMutationPort. A textual "call Guard first"
    followed by direct contract/registry YAML mutation is non-conforming.
  blocker_if_unavailable: BLOCKED_IMPLEMENTATION:PROTOCOL_AUTHORITY_BRIDGE_UNAVAILABLE
  forbidden_workaround:
    - direct registry or YAML mutation after a detached guard precheck
    - second Protocol truth store
    - reusable guard authorization token
    - direct WorkflowLifecycleAdapter access to ProtocolAuthorityMutationPort

scope:
  authorized_modify:
    - tooling/skills/10-plan-protocol-flow/SKILL.md
    - tooling/skills/20-draft-business-protocol/SKILL.md
    - tooling/skills/30-adopt-protocol-draft/SKILL.md
