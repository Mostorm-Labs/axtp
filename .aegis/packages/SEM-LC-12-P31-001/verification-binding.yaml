verification_binding:
  package_id: SEM-LC-12-P31-001

  authority_refs:
    verification_design:
      lifecycle: SEM-LC-11
      status: REQUIRED_IMMUTABLE_REF

    semantic_basis:
      lifecycle: SEM-LC-09
      status: REQUIRED_IMMUTABLE_REF

    architecture_basis:
      lifecycle: SEM-LC-10
      status: REQUIRED_IMMUTABLE_REF

  required_inputs:
    verification_spec:
      required: true
    obligation_set:
      required: true
    trusted_basis:
      required: true
    acceptance_oracles:
      required: true
    evidence_compilation:
      required: true

  evidence_classes:
    blocking:
      - implementation_correctness
      - invariant_validation
      - required_integration_validation

    corroborative:
      - performance_metrics
      - diagnostics
      - supplementary_observations

  execution_output_required:
    - changed_files
    - validation_results
    - result_revision
    - evidence_references
