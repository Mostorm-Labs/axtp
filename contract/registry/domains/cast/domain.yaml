domain: cast
description: Cast receiver control, legacy single-source status and optional fenced multi-presentation control for HID, AirPlay and WebCast.

methods:
  - id: 0x1601
    name: cast.getSession
    domain: cast
    status: draft
    bitOffset: 0
    since: 1.0.0
    description: Return the current cast receiver phase and active session summary.
    rpc_op: request_response
    request_schema: CastGetSessionParams
    response_schema: CastSessionState
    recommended_encoding: [json, tlv]
    capabilities: [cast.session]
    errors: [SUCCESS, INVALID_ARGUMENT, UNAVAILABLE]

  - id: 0x1602
    name: cast.stopSession
    domain: cast
    status: draft
    bitOffset: 1
    since: 1.0.0
    description: Stop the current cast session when one is active.
    rpc_op: request_response
    request_schema: CastStopSessionParams
    response_schema: CastStopSessionResult
    recommended_encoding: [json, tlv]
    capabilities: [cast.session]
    events: [cast.sessionStateChanged, cast.sessionStopped]
    errors: [SUCCESS, INVALID_ARGUMENT, INVALID_STATE, UNAVAILABLE]

  - id: 0x1603
    name: cast.getAirPlayName
    domain: cast
    status: draft
    bitOffset: 2
    since: 1.0.0
    description: Return the AirPlay receiver display name and publish state.
    rpc_op: request_response
    request_schema: Empty
    response_schema: CastAirPlayNameState
    recommended_encoding: [json, tlv]
    capabilities: [cast.session]
    errors: [SUCCESS, UNAVAILABLE]

  - id: 0x1604
    name: cast.setAirPlayName
    domain: cast
    status: draft
    bitOffset: 3
    since: 1.0.0
    description: Set the AirPlay receiver display name and request service rediscovery.
    rpc_op: request_response
    request_schema: CastSetAirPlayNameParams
    response_schema: CastAirPlayNameState
    recommended_encoding: [json, tlv]
    capabilities: [cast.session]
    events: [cast.sessionStateChanged]
    errors: [SUCCESS, INVALID_ARGUMENT, UNAVAILABLE]

  - id: 0x1605
    name: cast.getAudio
    domain: cast
    status: draft
    bitOffset: 4
    since: 1.0.0
    description: Return local cast audio playback and mute state.
    rpc_op: request_response
    request_schema: CastGetAudioParams
    response_schema: CastAudioState
    recommended_encoding: [json, tlv]
    capabilities: [cast.audio]
    errors: [SUCCESS, INVALID_ARGUMENT, UNAVAILABLE]

  - id: 0x1606
    name: cast.setAudio
    domain: cast
    status: draft
    bitOffset: 5
    since: 1.0.0
    description: Enable or disable local playback of received cast audio.
    rpc_op: request_response
    request_schema: CastSetAudioParams
    response_schema: CastAudioState
    recommended_encoding: [json, tlv]
    capabilities: [cast.audio]
    events: [cast.audioChanged]
    errors: [SUCCESS, INVALID_ARGUMENT, UNAVAILABLE]

  - id: 0x1607
    name: cast.setMuted
    domain: cast
    status: draft
    bitOffset: 6
    since: 1.0.0
    description: Mute or unmute local cast audio output.
    rpc_op: request_response
    request_schema: CastSetMutedParams
    response_schema: CastAudioState
    recommended_encoding: [json, tlv]
    capabilities: [cast.audio]
    events: [cast.audioChanged]
    errors: [SUCCESS, INVALID_ARGUMENT, UNAVAILABLE]

  - id: 0x1613
    name: cast.setAudioDelay
    domain: cast
    status: draft
    bitOffset: 18
    since: 1.0.0
    description: Set receiver-local audio playback delay compensation for cast audio.
    rpc_op: request_response
    request_schema: CastSetAudioDelayParams
    response_schema: CastAudioState
    recommended_encoding: [json, tlv]
    capabilities: [cast.audio]
    events: [cast.audioChanged]
    errors: [SUCCESS, INVALID_ARGUMENT, OUT_OF_RANGE, UNAVAILABLE]

  - id: 0x1608
    name: cast.getPinCodeConfig
    domain: cast
    status: draft
    bitOffset: 7
    since: 1.0.0
    description: Return cast PIN protection state, visibility, and optional secret material.
    rpc_op: request_response
    request_schema: CastGetPinCodeConfigParams
    response_schema: CastPinCodeConfig
    recommended_encoding: [json, tlv]
    capabilities: [cast.pinCode]
    errors: [SUCCESS, INVALID_ARGUMENT, UNAVAILABLE]

  - id: 0x1609
    name: cast.setPinCodeConfig
    domain: cast
    status: draft
    bitOffset: 8
    since: 1.0.0
    description: Enable or disable cast PIN protection and update display policy.
    rpc_op: request_response
    request_schema: CastSetPinCodeConfigParams
    response_schema: CastPinCodeConfig
    recommended_encoding: [json, tlv]
    capabilities: [cast.pinCode]
    events: [cast.pinCodeChanged]
    errors: [SUCCESS, INVALID_ARGUMENT, INVALID_STATE, UNAVAILABLE]

  - id: 0x160A
    name: cast.setPinCode
    domain: cast
    status: draft
    bitOffset: 9
    since: 1.0.0
    description: Set the current cast PIN value according to receiver policy.
    rpc_op: request_response
    request_schema: CastSetPinCodeParams
    response_schema: CastPinCodeConfig
    recommended_encoding: [json, tlv]
    capabilities: [cast.pinCode]
    events: [cast.pinCodeChanged]
    errors: [SUCCESS, INVALID_ARGUMENT, INVALID_STATE, UNAVAILABLE]

  - id: 0x160B
    name: cast.getWindowState
    domain: cast
    status: draft
    bitOffset: 10
    since: 1.0.0
    description: Return cast window visibility, mode, and bounds summary.
    rpc_op: request_response
    request_schema: Empty
    response_schema: CastWindowState
    recommended_encoding: [json, tlv]
    capabilities: [cast.window]
    errors: [SUCCESS, UNAVAILABLE]

  - id: 0x160C
    name: cast.setWindowState
    domain: cast
    status: draft
    bitOffset: 11
    since: 1.0.0
    description: Set cast window mode, fullscreen state, or always-on-top state.
    rpc_op: request_response
    request_schema: CastSetWindowStateParams
    response_schema: CastWindowState
    recommended_encoding: [json, tlv]
    capabilities: [cast.window]
    events: [cast.windowChanged]
    errors: [SUCCESS, INVALID_ARGUMENT, INVALID_STATE, UNAVAILABLE]

  - id: 0x160D
    name: cast.getBackendStatus
    domain: cast
    status: draft
    bitOffset: 12
    since: 1.0.0
    description: Return cast backend process, discoverability, and last-error state.
    rpc_op: request_response
    request_schema: CastGetBackendStatusParams
    response_schema: CastBackendStatus
    recommended_encoding: [json, tlv]
    capabilities: [cast.backend]
    errors: [SUCCESS, INVALID_ARGUMENT, UNAVAILABLE]

  - id: 0x160E
    name: cast.restartBackend
    domain: cast
    status: draft
    bitOffset: 13
    since: 1.0.0
    description: Restart the cast backend without restarting the receiver application or device.
    rpc_op: request_response
    request_schema: CastRestartBackendParams
    response_schema: CastRestartBackendResult
    recommended_encoding: [json, tlv]
    capabilities: [cast.backend]
    events: [cast.backendChanged, cast.sessionStopped]
    errors: [SUCCESS, BUSY, INVALID_STATE, UNAVAILABLE]

  - id: 0x160F
    name: cast.getFlowControlState
    domain: cast
    status: draft
    bitOffset: 14
    since: 1.0.0
    description: Return local cast render fps, queue policy, and low-frequency diagnostics.
    rpc_op: request_response
    request_schema: CastGetFlowControlStateParams
    response_schema: CastFlowControlState
    recommended_encoding: [json, tlv]
    capabilities: [cast.flowControl]
    errors: [SUCCESS, INVALID_ARGUMENT, UNAVAILABLE]

  - id: 0x1610
    name: cast.setRenderFps
    domain: cast
    status: draft
    bitOffset: 15
    since: 1.0.0
    description: Set the receiver-local target render fps for cast media.
    rpc_op: request_response
    request_schema: CastSetRenderFpsParams
    response_schema: CastFlowControlState
    recommended_encoding: [json, tlv]
    capabilities: [cast.flowControl]
    events: [cast.flowControlChanged]
    errors: [SUCCESS, INVALID_ARGUMENT, OUT_OF_RANGE, UNAVAILABLE]

  - id: 0x1611
    name: cast.setFlowPolicy
    domain: cast
    status: draft
    bitOffset: 16
    since: 1.0.0
    description: Set receiver-local cast queue, late-frame, drop, and overlay policy.
    rpc_op: request_response
    request_schema: CastSetFlowPolicyParams
    response_schema: CastFlowControlState
    recommended_encoding: [json, tlv]
    capabilities: [cast.flowControl]
    events: [cast.flowControlChanged]
    errors: [SUCCESS, INVALID_ARGUMENT, OUT_OF_RANGE, UNAVAILABLE]

  - id: 0x1612
    name: cast.getStatus
    domain: cast
    status: draft
    bitOffset: 17
    since: 1.0.0
    description: Return a current cast receiver snapshot for UI reload, reconnect, or event-loss recovery.
    rpc_op: request_response
    request_schema: CastGetStatusParams
    response_schema: CastStatus
    recommended_encoding: [json, tlv]
    capabilities: [cast.status]
    errors: [SUCCESS, INVALID_ARGUMENT, UNAVAILABLE, NOT_SUPPORTED]

  - id: 0x1614
    name: cast.setVideoStreamParams
    domain: cast
    status: draft
    bitOffset: 19
    since: 1.0.0
    description: Request cast video stream parameter reconfiguration; an active stream is coordinated through close then open, while a source without an active stream is opened directly.
    rpc_op: request_response
    request_schema: CastSetVideoStreamParamsParams
    response_schema: CastSetVideoStreamParamsResult
    recommended_encoding: [json, tlv]
    capabilities: [cast.flowControl]
    events: [cast.flowControlChanged]
    errors: [SUCCESS, INVALID_ARGUMENT, INVALID_STATE, OUT_OF_RANGE, NOT_SUPPORTED, BUSY, MEDIA_SOURCE_UNAVAILABLE, MEDIA_FRAMERATE_UNSUPPORTED, MEDIA_BITRATE_UNSUPPORTED, MEDIA_STREAM_START_FAILED, MEDIA_STREAM_STOP_FAILED, UNAVAILABLE]

  - id: 0x1615
    name: cast.getControlCapabilities
    domain: cast
    status: draft
    bitOffset: 20
    since: 1.0.0
    description: Discover supported control versions, runtime epoch and bounded multi-presentation guarantees before selecting a version.
    rpc_op: request_response
    request_schema: Empty
    response_schema: CastControlCapabilities
    recommended_encoding: [json, tlv]
    capabilities: [cast.presentation]
    errors: [SUCCESS, NOT_SUPPORTED, UNAVAILABLE]

  - id: 0x1616
    name: cast.stopPresentation
    domain: cast
    status: draft
    bitOffset: 21
    since: 1.0.0
    description: Withdraw one exact presentation after atomic owner-side fence validation; success returns an admitted operation, not receiver shutdown.
    rpc_op: request_response
    request_schema: CastStopPresentationParams
    response_schema: CastControlOperation
    recommended_encoding: [json, tlv]
    capabilities: [cast.presentation, cast.controlOperations]
    events: [cast.sessionsChanged, cast.presentationChanged, cast.audioPolicyChanged, cast.controlOperationChanged]
    errors: [SUCCESS, NOT_SUPPORTED, INVALID_ARGUMENT, INVALID_STATE, BUSY, UNAVAILABLE, INTERNAL_ERROR]

  - id: 0x1617
    name: cast.setSessionAudioEnabled
    domain: cast
    status: draft
    bitOffset: 22
    since: 1.0.0
    description: Set explicit enabled intent for one exact presented session; effective audio participation is reported separately.
    rpc_op: request_response
    request_schema: CastSetSessionAudioEnabledParams
    response_schema: CastControlOperation
    recommended_encoding: [json, tlv]
    capabilities: [cast.audioPolicy, cast.controlOperations]
    events: [cast.audioPolicyChanged, cast.controlOperationChanged]
    errors: [SUCCESS, NOT_SUPPORTED, INVALID_ARGUMENT, INVALID_STATE, BUSY, UNAVAILABLE, INTERNAL_ERROR]

  - id: 0x1618
    name: cast.getControlOperation
    domain: cast
    status: draft
    bitOffset: 23
    since: 1.0.0
    description: Query the original intent by runtime, client and command identity; NOT_FOUND means unknown outcome rather than not executed.
    rpc_op: request_response
    request_schema: CastGetControlOperationParams
    response_schema: CastControlOperation
    recommended_encoding: [json, tlv]
    capabilities: [cast.controlOperations]
    errors: [SUCCESS, NOT_SUPPORTED, INVALID_ARGUMENT, INVALID_STATE, NOT_FOUND, UNAVAILABLE]

  - id: 0x1619
    name: cast.setPresentationSettings
    domain: cast
    status: draft
    bitOffset: 24
    since: 1.0.0
    description: Set exactly one supported host setting with optimistic revision, bounded dedup and explicit field-only persistence; returns per-stage asynchronous results without automatic restart.
    rpc_op: request_response
    request_schema: CastSetPresentationSettingsParams
    response_schema: CastControlOperation
    recommended_encoding: [json, tlv]
    capabilities: [cast.presentationSettings, cast.controlOperations]
    events: [cast.presentationSettingsChanged, cast.presentationChanged, cast.audioPolicyChanged]
    errors: [SUCCESS, NOT_SUPPORTED, INVALID_ARGUMENT, INVALID_STATE, OUT_OF_RANGE, BUSY, UNAVAILABLE, INTERNAL_ERROR]

  - id: 0x161A
    name: cast.getWebCastBackendState
    domain: cast
    status: draft
    bitOffset: 25
    since: 1.0.0
    description: Read a secret-free WebCast signaling backend snapshot and independent event barrier; selection for new joins is separate from retained peers.
    rpc_op: request_response
    request_schema: CastGetWebCastBackendStateParams
    response_schema: CastWebCastBackendSnapshot
    recommended_encoding: [json, tlv]
    capabilities: [cast.webcastBackend]
    errors: [SUCCESS, NOT_SUPPORTED, INVALID_ARGUMENT, UNAVAILABLE]

events:
  - id: 0x1601
    name: cast.sessionIncoming
    domain: cast
    status: draft
    bitOffset: 0
    since: 1.0.0
    description: Emitted when a cast source initiates a receiver session.
    event_schema: CastSessionIncomingEvent
    severity: info
    trigger: [source connected, backend incoming session]
    capabilities: [cast.session]

  - id: 0x1602
    name: cast.sessionStateChanged
    domain: cast
    status: draft
    bitOffset: 1
    since: 1.0.0
    description: Emitted when receiver phase, protocol state, or low-frequency session media state changes.
    event_schema: CastSessionStateChangedEvent
    severity: info
    trigger: [incoming session, authentication, stream starting, media flow started, interruption, stopping]
    capabilities: [cast.session]

  - id: 0x1603
    name: cast.sessionStarted
    domain: cast
    status: draft
    bitOffset: 2
    since: 1.0.0
    description: Emitted when a cast session becomes user-visible after first frame or local playback starts.
    event_schema: CastSessionStartedEvent
    severity: info
    trigger: [first frame rendered, local playback started]
    capabilities: [cast.session]

  - id: 0x1604
    name: cast.sessionStopped
    domain: cast
    status: draft
    bitOffset: 3
    since: 1.0.0
    description: Emitted when a cast session ends normally or is forced to stop.
    event_schema: CastSessionStoppedEvent
    severity: info
    trigger: [cast.stopSession, source closed, backend restart, backend exited]
    capabilities: [cast.session]

  - id: 0x1605
    name: cast.sessionFailed
    domain: cast
    status: draft
    bitOffset: 4
    since: 1.0.0
    description: Emitted when cast connection, authentication, negotiation, or backend handling fails.
    event_schema: CastSessionFailedEvent
    severity: error
    trigger: [connection failed, authentication failed, media negotiation failed, backend failed]
    capabilities: [cast.session]

  - id: 0x1606
    name: cast.audioChanged
    domain: cast
    status: draft
    bitOffset: 5
    since: 1.0.0
    description: Emitted when local cast audio playback, mute, or delay compensation state changes.
    event_schema: CastAudioChangedEvent
    severity: info
    trigger: [cast.setAudio, cast.setMuted, cast.setAudioDelay, local UI, session started, session stopped]
    capabilities: [cast.audio]

  - id: 0x1607
    name: cast.pinCodeChanged
    domain: cast
    status: draft
    bitOffset: 6
    since: 1.0.0
    description: Emitted when cast PIN protection configuration or current PIN state changes.
    event_schema: CastPinCodeChangedEvent
    severity: info
    trigger: [cast.setPinCodeConfig, cast.setPinCode, generated PIN changed]
    capabilities: [cast.pinCode]

  - id: 0x1608
    name: cast.pinCodeRequired
    domain: cast
    status: draft
    bitOffset: 7
    since: 1.0.0
    description: Emitted when a cast source is waiting for PIN authentication.
    event_schema: CastPinCodeRequiredEvent
    severity: info
    trigger: [incoming session requires PIN]
    capabilities: [cast.pinCode]

  - id: 0x1609
    name: cast.pinCodeAuthFailed
    domain: cast
    status: draft
    bitOffset: 8
    since: 1.0.0
    description: Emitted when PIN authentication fails, times out, or is cancelled.
    event_schema: CastPinCodeAuthFailedEvent
    severity: warning
    trigger: [wrong PIN, authentication timeout, authentication cancelled, too many attempts]
    capabilities: [cast.pinCode]

  - id: 0x160A
    name: cast.windowChanged
    domain: cast
    status: draft
    bitOffset: 9
    since: 1.0.0
    description: Emitted when cast window visibility, mode, topmost state, or bounds changes.
    event_schema: CastWindowChangedEvent
    severity: info
    trigger: [cast.setWindowState, local UI, session started, session stopped]
    capabilities: [cast.window]

  - id: 0x160B
    name: cast.backendChanged
    domain: cast
    status: draft
    bitOffset: 10
    since: 1.0.0
    description: Emitted when cast backend ready, restart, exit, failed, or discoverable state changes.
    event_schema: CastBackendChangedEvent
    severity: info
    trigger: [backend started, backend restarting, backend exited, backend failed, discovery changed]
    capabilities: [cast.backend]

  - id: 0x160C
    name: cast.flowControlChanged
    domain: cast
    status: draft
    bitOffset: 11
    since: 1.0.0
    description: Emitted when receiver-local cast flow policy, video stream parameters, or low-frequency flow statistics change.
    event_schema: CastFlowControlChangedEvent
    severity: info
    trigger: [cast.setRenderFps, cast.setFlowPolicy, cast.setVideoStreamParams, diagnostics sample]
    capabilities: [cast.flowControl]

  - id: 0x160D
    name: cast.receiversChanged
    domain: cast
    status: draft
    bitOffset: 12
    since: 1.0.0
    description: Replace the receiver section after a logical control commit; not a full status event.
    event_schema: CastReceiversChangedEvent
    severity: info
    trigger: [receiver availability changed]
    capabilities: [cast.presentation]

  - id: 0x160E
    name: cast.sessionsChanged
    domain: cast
    status: draft
    bitOffset: 13
    since: 1.0.0
    description: Replace the current multi-session collection as one part of an atomic control commit group.
    event_schema: CastSessionsChangedEvent
    severity: info
    trigger: [session joined, session removed, session media state changed]
    capabilities: [cast.presentation]

  - id: 0x160F
    name: cast.presentationChanged
    domain: cast
    status: draft
    bitOffset: 14
    since: 1.0.0
    description: Replace only presentation slots, layout and capacity after a logical control commit.
    event_schema: CastPresentationChangedEvent
    severity: info
    trigger: [presentation binding changed, lifecycle changed, capacity changed, layout changed]
    capabilities: [cast.presentation]

  - id: 0x1610
    name: cast.audioPolicyChanged
    domain: cast
    status: draft
    bitOffset: 15
    since: 1.0.0
    description: Replace audio policy intent and effective participation sets after a control commit.
    event_schema: CastAudioPolicyChangedEvent
    severity: info
    trigger: [enabled intent changed, effective audio participation changed, audio policy changed]
    capabilities: [cast.audioPolicy]

  - id: 0x1611
    name: cast.controlOperationChanged
    domain: cast
    status: draft
    bitOffset: 16
    since: 1.0.0
    description: Publish one admitted P0 per-session operation record; P1 settings progress uses RPC/query and its independent settings event, never this sequence.
    event_schema: CastControlOperationChangedEvent
    severity: info
    trigger: [operation admitted, operation terminal]
    capabilities: [cast.controlOperations]

  - id: 0x1612
    name: cast.presentationSettingsChanged
    domain: cast
    status: draft
    bitOffset: 17
    since: 1.0.0
    description: Replace complete settings state using independent settingsContext/settingsEventSequence; never consumes the P0 eventSequence.
    event_schema: CastPresentationSettingsChangedEvent
    severity: info
    trigger: [desired setting committed, adopted policy changed, storage observation changed, settings issue or lock changed]
    capabilities: [cast.presentationSettings]

  - id: 0x1613
    name: cast.webcastBackendChanged
    domain: cast
    status: draft
    bitOffset: 18
    since: 1.0.0
    description: Replace complete WebCast backend state using independent backendContext; never consumes P0 or settings event sequences.
    event_schema: CastWebCastBackendSnapshot
    severity: info
    trigger: [join backend selection changed, signaling availability changed, local listener lifecycle changed, peer connectivity changed, backend error changed]
    capabilities: [cast.webcastBackend]

types:
  CastSourceSummary:
    kind: object
    description: Summary of a cast source device or local AXTP sender.
    fields:
      - id: 0x01
        name: name
        type: string
        required: false
        max_length: 128
        description: User-visible source name when known.
      - id: 0x02
        name: model
        type: string
        required: false
        max_length: 128
        description: Source model identifier when known.
      - id: 0x03
        name: address
        type: string
        required: false
        max_length: 128
        description: Network or transport address summary when safe to expose.
      - id: 0x04
        name: sourceId
        type: string
        required: false
        max_length: 128
        description: Receiver-local source identifier.
      - id: 0x05
        name: protocol
        type: enum
        required: false
        enum: [airplay, hid, unknown]
        description: Protocol path that produced the source summary.

  CastMediaSummary:
    kind: object
    description: Low-frequency media summary for a cast session.
    fields:
      - id: 0x01
        name: firstFrame
        type: bool
        required: false
        description: Whether the first visible frame has rendered.
      - id: 0x02
        name: width
        type: uint32
        required: false
        description: Current media width in pixels.
      - id: 0x03
        name: height
        type: uint32
        required: false
        description: Current media height in pixels.
      - id: 0x04
        name: orientation
        type: enum
        required: false
        enum: [landscape, portrait, unknown]
        description: Current media orientation summary.
      - id: 0x05
        name: inputFps
        type: number
        required: false
        min: 0
        description: Estimated incoming media frame rate.
      - id: 0x06
        name: renderFps
        type: number
        required: false
        min: 0
        description: Estimated local render frame rate.
      - id: 0x07
        name: audioActive
        type: bool
        required: false
        description: Whether local receiver audio output is active.

  CastLastError:
    kind: object
    description: Redactable backend or receiver error summary.
    fields:
      - id: 0x01
        name: code
        type: string
        required: false
        max_length: 64
        description: Backend-local or AXTP-visible error code.
      - id: 0x02
        name: message
        type: string
        required: false
        max_length: 512
        description: Human-readable error summary suitable for authorized clients.
      - id: 0x03
        name: occurredAt
        type: string
        required: false
        max_length: 64
        description: Timestamp when the error was observed.
      - id: 0x04
        name: redacted
        type: bool
        required: false
        default: false
        description: Whether sensitive details were removed from this summary.

  CastGetSessionParams:
    kind: object
    description: Selector for cast receiver and active session summary.
    fields:
      - id: 0x01
        name: include
        type: array
        array:
          item_type: string
        required: false
        description: Optional summary sections, such as source, media, or airPlayName.
      - id: 0x02
        name: sessionId
        type: string
        required: false
        max_length: 128
        description: Optional receiver-local session id to query.

  CastSessionState:
    kind: object
    description: Current receiver phase and active session state.
    fields:
      - id: 0x01
        name: receiverState
        type: enum
        required: true
        enum: [disabled, starting, ready, busy, failed]
        description: Receiver service availability state.
      - id: 0x02
        name: sessionId
        type: string
        required: false
        max_length: 128
        description: Receiver-local active session id.
      - id: 0x03
        name: receiverPhase
        type: enum
        required: true
        enum: [idle, incoming, authenticating, streamStarting, streaming, rendering, interrupted, stopping, ended, failed]
        description: Protocol-neutral receiver phase used by UI and reconnection calibration.
      - id: 0x04
        name: sessionState
        type: enum
        required: false
        enum: [idle, incoming, waitingForPassword, authenticated, preparing, casting, interrupted, stopping, ended, failed]
        description: AirPlay or backend-specific session state detail.
      - id: 0x05
        name: protocol
        type: enum
        required: false
        enum: [airplay, hid, unknown]
        description: Cast protocol path currently represented by this state.
      - id: 0x06
        name: airPlayName
        type: string
        required: false
        max_length: 128
        description: Current published AirPlay receiver display name.
      - id: 0x07
        name: source
        type: CastSourceSummary
        required: false
        description: Source device summary.
      - id: 0x08
        name: media
        type: CastMediaSummary
        required: false
        description: Low-frequency media summary.
      - id: 0x09
        name: backendState
        type: enum
        required: false
        enum: [starting, ready, restarting, exited, failed, disabled]
        description: Current backend state summary.
      - id: 0x0A
        name: reason
        type: enum
        required: false
