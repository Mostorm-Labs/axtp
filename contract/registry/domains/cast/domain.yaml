  CastGetBackendStatusParams:
    kind: object
    description: Selector for cast backend status.
    fields:
      - id: 0x01
        name: includeLastError
        type: bool
        required: false
        default: false
        description: Whether to include the last backend error summary.

  CastRestartBackendParams:
    kind: object
    description: Request to restart the cast backend.
    fields:
      - id: 0x01
        name: reason
        type: enum
        required: false
        enum: [manualRecovery, configChanged, backendUnhealthy, unknown]
        description: Caller-visible restart reason.
      - id: 0x02
        name: force
        type: bool
        required: false
        default: false
        description: Whether the backend adapter may force cleanup before restart.

  CastBackendStatus:
    kind: object
    description: Cast backend state, process summary, discoverability, and last error.
    fields:
      - id: 0x01
        name: backendType
        type: enum
        required: true
        enum: [uxplay, unknown]
        description: Backend implementation type.
      - id: 0x02
        name: state
        type: enum
        required: true
        enum: [starting, ready, restarting, exited, failed, disabled]
        description: Backend runtime state.
      - id: 0x03
        name: discoverable
        type: bool
        required: true
        description: Whether the cast service is discoverable by sources.
      - id: 0x04
        name: pid
        type: uint32
        required: false
        description: Backend process id when available.
      - id: 0x05
        name: version
        type: string
        required: false
        max_length: 128
        description: Backend version or build identifier.
      - id: 0x06
        name: activeSessionId
        type: string
        required: false
        max_length: 128
        description: Active cast session id currently owned by the backend.
      - id: 0x07
        name: restartInProgress
        type: bool
        required: true
        default: false
        description: Whether a backend restart is currently in progress.
      - id: 0x08
        name: lastError
        type: CastLastError
        required: false
        description: Last backend error summary when requested and available.
      - id: 0x09
        name: updatedAt
        type: string
        required: false
        max_length: 64
        description: Timestamp for this backend status.

  CastRestartBackendResult:
    kind: object
    description: Result of requesting a cast backend restart.
    fields:
      - id: 0x01
        name: accepted
        type: bool
        required: true
        description: Whether the receiver accepted the restart request.
      - id: 0x02
        name: backendType
        type: enum
        required: true
        enum: [uxplay, unknown]
        description: Backend implementation affected by the restart.
      - id: 0x03
        name: state
        type: enum
        required: true
        enum: [starting, ready, restarting, exited, failed, disabled]
        description: Backend state after accepting the restart request.
      - id: 0x04
        name: restartId
        type: string
        required: false
        max_length: 128
        description: Receiver-local restart operation id.
      - id: 0x05
        name: activeSessionEnded
        type: bool
        required: true
        description: Whether an active cast session was ended by the restart.
      - id: 0x06
        name: endedSessionId
        type: string
        required: false
        max_length: 128
        description: Session ended by the restart.
      - id: 0x07
        name: sessionStopReason
        type: enum
        required: false
        enum: [backendRestart, backendExited, error, unknown]
        description: Session stop reason reported for the ended session.
      - id: 0x08
        name: estimatedReadyInMs
        type: uint32
        required: false
        description: Estimated backend recovery time in milliseconds.
      - id: 0x09
        name: updatedAt
        type: string
        required: false
        max_length: 64
        description: Timestamp for this restart result.

  CastBackendChangedEvent:
    kind: object
    description: Event payload for cast backend state changes.
    fields:
      - id: 0x01
        name: changedFields
        type: array
        array:
          item_type: string
        required: true
        description: Field names changed by this event.
      - id: 0x02
        name: state
        type: CastBackendStatus
        required: true
        description: Backend status after the change.
      - id: 0x03
        name: reason
        type: enum
        required: false
        enum: [manualRecovery, configChanged, backendUnhealthy, backendExited, unknown]
        description: Change reason.
      - id: 0x04
        name: restartId
        type: string
        required: false
        max_length: 128
        description: Restart operation id when this event is restart-related.
      - id: 0x05
        name: activeSessionEnded
        type: bool
        required: false
        description: Whether this backend change ended an active session.
      - id: 0x06
        name: endedSessionId
        type: string
        required: false
        max_length: 128
        description: Session ended by this backend change.
      - id: 0x07
        name: updatedAt
        type: string
        required: false
        max_length: 64
        description: Timestamp for this event.

  CastGetFlowControlStateParams:
    kind: object
    description: Selector for cast receiver flow control state.
    fields:
      - id: 0x01
        name: includeStats
        type: bool
        required: false
        default: true
        description: Whether to include low-frequency diagnostic counters.
      - id: 0x02
        name: includePolicy
        type: bool
        required: false
        default: true
        description: Whether to include current flow policy fields.
      - id: 0x03
        name: sessionId
        type: string
        required: false
        max_length: 128
        description: Optional receiver-local session id.

  CastSetRenderFpsParams:
    kind: object
    description: Request to set receiver-local target render fps.
    fields:
      - id: 0x01
        name: fps
        type: number
        required: true
        min: 0
        description: Target local render fps; zero means uncapped.
      - id: 0x02
        name: sessionId
        type: string
        required: false
        max_length: 128
        description: Optional receiver-local session id.
      - id: 0x03
        name: scope
        type: enum
        required: false
        enum: [currentSession, default]
        description: State target hint; this is not an authorization scope.

  CastSetFlowPolicyParams:
    kind: object
    description: Request to update receiver-local queue, late-frame, drop, and overlay policy.
    fields:
      - id: 0x01
        name: videoQueueFrames
        type: uint32
        required: false
        min: 1
        description: Maximum queued video frames.
      - id: 0x02
        name: lateFrameThresholdMs
        type: uint32
        required: false
        description: Late-frame threshold in milliseconds.
      - id: 0x03
        name: dropMode
        type: enum
        required: false
        enum: [drop-late, drop-oldest, render-latest]
        description: Local frame drop policy.
      - id: 0x04
        name: overlayEnabled
        type: bool
        required: false
        description: Whether receiver diagnostics overlay is enabled.
      - id: 0x05
        name: sessionId
        type: string
        required: false
        max_length: 128
        description: Optional receiver-local session id.
      - id: 0x06
        name: scope
        type: enum
        required: false
        enum: [currentSession, default]
        description: State target hint; this is not an authorization scope.

  CastSetVideoStreamParamsParams:
    kind: object
    description: Request to update the active cast video stream frame rate or bitrate, optionally resetting selected fields.
    fields:
      - id: 0x01
        name: sessionId
        type: string
        required: false
        max_length: 128
        description: Optional receiver-local cast session id.
      - id: 0x02
        name: frameRate
        type: uint32
        required: false
        min: 1
        description: Optional target encoded video frame rate; zero is invalid, omission leaves the current session value unchanged or unset if never configured, and only resetFields clears it and restores the source/profile default.
      - id: 0x03
        name: bitrateKbps
        type: uint32
        required: false
        min: 1
        description: Optional target encoded video bitrate in kbps; zero is invalid, omission leaves the current session value unchanged or unset if never configured, and only resetFields clears it and restores the source/profile default.
      - id: 0x04
        name: resetFields
        type: array
        array:
          item_type: string
        required: false
        description: Optional video parameter field names to reset to the source or profile default.

  CastSetVideoStreamParamsResult:
    kind: object
    description: Result and reconfiguration status for cast video stream parameter changes.
    fields:
      - id: 0x01
        name: accepted
        type: bool
        required: true
        description: Whether the receiver accepted the requested video parameter change.
      - id: 0x02
        name: state
        type: enum
        required: true
        enum: [pending, applied, failed, rolledBack, unchanged]
        description: Reconfiguration lifecycle state.
      - id: 0x03
        name: sessionId
        type: string
        required: false
        max_length: 128
        description: Receiver-local cast session id associated with the result.
      - id: 0x04
        name: reconfigureId
        type: string
        required: false
        max_length: 128
        description: Identifier for this video stream reconfiguration operation.
      - id: 0x05
        name: previousStreamId
        type: uint32
        required: false
        description: Previously active video stream id when the operation replaced a stream.
      - id: 0x06
        name: activeStreamId
        type: uint32
        required: false
        description: Currently active video stream id after the operation.
      - id: 0x07
        name: sourceVideo
        type: CastVideoStreamParamsState
        required: true
        description: Effective source video stream parameter state after the request.

  CastVideoStreamParamsState:
    kind: object
    description: Desired and effective cast source video stream parameters and reconfiguration state.
    fields:
      - id: 0x01
        name: sessionId
        type: string
        required: false
        max_length: 128
        description: Receiver-local cast session id.
      - id: 0x02
        name: source
        type: string
        required: false
        max_length: 128
        description: Source identifier whose video stream parameters are represented.
      - id: 0x03
        name: desiredFrameRate
        type: uint32
        required: false
        min: 1
        description: Requested video encoder frame rate, if one is pending or configured; zero is invalid.
      - id: 0x04
        name: desiredBitrateKbps
        type: uint32
        required: false
        min: 1
        description: Requested video encoder bitrate in kbps, if one is pending or configured; zero is invalid.
      - id: 0x05
        name: effectiveFrameRate
        type: uint32
        required: false
        min: 1
        description: Effective encoded video frame rate currently applied by the source.
      - id: 0x06
        name: effectiveBitrateKbps
        type: uint32
        required: false
        min: 1
        description: Effective encoded video bitrate in kbps currently applied by the source.
      - id: 0x07
        name: streamProfile
        type: string
        required: false
        max_length: 64
        description: Effective video STREAM profile.
      - id: 0x08
        name: encoder
        type: string
        required: false
        max_length: 128
        description: Encoder or encoder profile selected for the source video stream.
      - id: 0x09
        name: reconfigureId
        type: string
        required: false
        max_length: 128
        description: Most recent video stream reconfiguration operation id.
      - id: 0x0A
        name: state
        type: enum
        required: false
        enum: [idle, pending, closing, opening, streaming, failed, rolledBack]
        description: Current source video stream reconfiguration state.
      - id: 0x0B
        name: phase
        type: enum
        required: false
        enum: [idle, pending, closing, opening, streaming, failed, rolledBack]
        description: Current source video stream lifecycle phase during reconfiguration.
      - id: 0x0C
        name: previousStreamId
        type: uint32
        required: false
        description: Previous active downstream video stream id when a reconfiguration replaces it.
      - id: 0x0D
        name: activeStreamId
        type: uint32
        required: false
        description: Active downstream video stream id, if one is established.
      - id: 0x0E
        name: rollbackApplied
        type: bool
        required: false
        description: Whether the previous stream parameters were restored after a failed reconfiguration.
      - id: 0x0F
        name: lastError
        type: CastLastError
        required: false
        description: Last reconfiguration or stream lifecycle error, when available.
      - id: 0x10
        name: changedFields
        type: array
        array:
          item_type: string
        required: false
        description: Video parameter fields changed by the most recent operation.

  CastFlowControlState:
    kind: object
    description: Receiver-local cast flow control policy and low-frequency statistics.
    fields:
      - id: 0x01
        name: targetRenderFps
        type: number
        required: true
        min: 0
        description: Configured target render fps; zero means uncapped.
      - id: 0x02
        name: inputFps
        type: number
        required: false
        min: 0
        description: Estimated incoming media frame rate.
      - id: 0x03
        name: renderFps
        type: number
        required: false
        min: 0
        description: Estimated local render frame rate.
      - id: 0x04
        name: dropMode
        type: enum
        required: true
        enum: [drop-late, drop-oldest, render-latest]
        description: Local frame drop policy.
      - id: 0x05
        name: videoQueueFrames
        type: uint32
        required: true
        min: 1
        description: Maximum queued video frames.
      - id: 0x06
        name: videoQueueDepth
        type: uint32
        required: false
        description: Current queued video frame depth.
      - id: 0x07
        name: audioQueueDepth
        type: uint32
        required: false
        description: Current queued audio frame depth when known.
      - id: 0x08
        name: lateFrameThresholdMs
        type: uint32
        required: true
        description: Late-frame threshold in milliseconds.
      - id: 0x09
        name: overlayEnabled
        type: bool
        required: true
        description: Whether diagnostics overlay is enabled.
      - id: 0x0A
        name: droppedFrames
        type: uint64
        required: false
        description: Low-frequency dropped-frame counter.
      - id: 0x0B
        name: lateFrames
        type: uint64
        required: false
        description: Low-frequency late-frame counter.
      - id: 0x0C
        name: keyframeRequestCount
        type: uint32
        required: false
        description: Internal keyframe requests triggered by receiver policy.
      - id: 0x0D
        name: keyFrameOnDropBurst
        type: bool
        required: false
        description: Whether the receiver may internally request a keyframe after a drop burst.
      - id: 0x0E
        name: changedFields
        type: array
        array:
          item_type: string
        required: false
        description: Field names changed by the latest operation or event.
      - id: 0x0F
        name: sampledAt
        type: string
        required: false
        max_length: 64
        description: Timestamp for this flow sample.
      - id: 0x10
        name: sourceVideo
        type: CastVideoStreamParamsState
        required: false
        description: Effective source video stream parameters and reconfiguration state.

  CastFlowControlChangedEvent:
    kind: object
    description: Event payload for cast flow control changes or low-frequency diagnostic samples.
    fields:
      - id: 0x01
        name: changedFields
        type: array
        array:
          item_type: string
        required: true
        description: Field names changed or sampled by this event.
      - id: 0x02
        name: state
        type: CastFlowControlState
        required: true
        description: Flow control state after the change or sample.
      - id: 0x03
        name: reason
        type: enum
        required: false
        enum: [manualFlowControl, videoStreamParams, videoStreamReconfigure, diagnosticsSample, sessionStarted, sessionStopped, unknown]
        description: Change or sampling reason.
      - id: 0x04
        name: sampledAt
        type: string
        required: false
        max_length: 64
        description: Timestamp for this event.
      - id: 0x05
        name: sourceVideo
        type: CastVideoStreamParamsState
        required: false
        description: Effective source video stream parameter state associated with this event.
      - id: 0x06
        name: reconfigureId
        type: string
        required: false
        max_length: 128
        description: Video stream reconfiguration operation id associated with this event.

  CastGetStatusParams:
    kind: object
    description: Selector for current cast receiver snapshot.
    fields:
      - id: 0x01
        name: include
        type: array
        array:
          item_type: string
        required: false
        description: Optional status sections to include.
      - id: 0x02
        name: includeSensitive
        type: bool
        required: false
        default: false
        description: Whether authorized callers request sensitive summary fields.
      - id: 0x03
        name: controlVersion
        type: uint32
        required: false
        description: Explicit multi-control version; v1 unifiedControl requires a complete atomic six-section projection. Unknown versions return NOT_SUPPORTED.

  CastReceiverSummary:
    kind: object
    description: Snapshot receiver role and protocol-neutral phase summary.
    fields:
      - id: 0x01
        name: role
        type: enum
        required: true
        enum: [receiver]
        description: Cast endpoint role.
      - id: 0x02
        name: protocols
        type: array
        array:
          item_type: string
        required: true
        description: Supported or active cast protocol paths.
      - id: 0x03
        name: state
        type: enum
        required: true
        enum: [disabled, starting, ready, busy, failed]
        description: Receiver service availability state.
      - id: 0x04
        name: receiverPhase
        type: enum
        required: true
        enum: [idle, incoming, authenticating, streamStarting, streaming, rendering, interrupted, stopping, ended, failed]
        description: Protocol-neutral receiver phase.

  CastSessionStatusSummary:
    kind: object
    description: Snapshot active session summary for status views.
    fields:
      - id: 0x01
        name: sessionId
        type: string
        required: false
        max_length: 128
        description: Receiver-local session id.
      - id: 0x02
        name: receiverPhase
        type: enum
        required: false
        enum: [idle, incoming, authenticating, streamStarting, streaming, rendering, interrupted, stopping, ended, failed]
        description: Protocol-neutral receiver phase.
      - id: 0x03
        name: sessionState
        type: enum
        required: false
        enum: [idle, incoming, waitingForPassword, authenticated, preparing, casting, interrupted, stopping, ended, failed]
        description: Backend-specific session state.
      - id: 0x04
        name: protocol
        type: enum
        required: false
        enum: [airplay, hid, unknown]
        description: Protocol path represented by the active session.
      - id: 0x05
        name: sourceName
        type: string
        required: false
        max_length: 128
        description: User-visible source name.

  CastPinCodeStatusSummary:
    kind: object
    description: Snapshot PIN summary for status views.
    fields:
      - id: 0x01
        name: enabled
        type: bool
        required: true
        description: Whether PIN protection is enabled.
      - id: 0x02
        name: hasPinCode
        type: bool
        required: true
        description: Whether a current PIN exists.
      - id: 0x03
        name: pinDisplay
        type: enum
        required: false
        enum: [hidden, authorizedClients, localUi, both]
        description: Where the current PIN may be displayed.
      - id: 0x04
        name: pinCode
        type: string
        required: false
        description: Plaintext PIN value when visible to the caller.
      - id: 0x05
        name: redacted
        type: bool
        required: false
        description: Whether sensitive fields were withheld.
      - id: 0x06
        name: visibility
        type: enum
        required: false
        enum: [hidden, authorizedOnly, localUi, both]
        description: Visibility policy applied to this summary.

  CastStatus:
    kind: object
    description: Current cast receiver snapshot for reconnect and event-loss recovery.
    fields:
      - id: 0x01
        name: receiver
        type: CastReceiverSummary
        required: true
        description: Receiver role and phase summary.
      - id: 0x02
        name: session
        type: CastSessionStatusSummary
        required: false
        description: Active session summary.
      - id: 0x03
        name: pinCode
        type: CastPinCodeStatusSummary
        required: false
        description: PIN protection summary.
      - id: 0x04
        name: audio
        type: CastAudioState
        required: false
        description: Local audio summary.
      - id: 0x05
        name: window
        type: CastWindowState
        required: false
        description: Cast window summary.
      - id: 0x06
        name: backend
        type: CastBackendStatus
        required: false
        description: Backend summary.
      - id: 0x07
        name: flowControl
        type: CastFlowControlState
        required: false
        description: Flow control summary.
      - id: 0x08
        name: sampledAt
        type: string
        required: true
        max_length: 64
        description: Timestamp for this status snapshot.
      - id: 0x09
        name: redacted
        type: bool
        required: false
        description: Whether any sensitive snapshot fields were withheld.
      - id: 0x0A
        name: controlSync
        type: CastControlSnapshotCursor
        required: false
        description: Required with requested v1 sections; atomic capture revision and published event barrier in one runtime epoch.
      - id: 0x0B
        name: receivers
        type: array
        array: { item_type: CastReceiverState }
        required: false
        description: Required in v1 unifiedControl; full bounded receiver set including disabled and failed receivers.
      - id: 0x0C
        name: sessions
        type: array
        array: { item_type: CastMultiSessionState }
        required: false
        description: Required in v1 unifiedControl; full bounded current session set, possibly empty, captured with slots and audio.
      - id: 0x0D
        name: presentation
        type: CastPresentationState
        required: false
        description: Required in v1 unifiedControl; does not replace old single-source summaries.
      - id: 0x0E
        name: audioPolicy
        type: CastAudioPolicyState
        required: false
        description: Required in v1 unifiedControl; selected intent and effective participation are separate from legacy audio.
      - id: 0x0F
        name: presentationSettings
        type: CastPresentationSettingsState
        required: false
        description: Required only when P1 is supported and explicitly requested; combined P0/P1 capture shares one host commit boundary and keeps independent event barriers.

      - { id: 0x10, name: webcastBackend, type: CastWebCastBackendSnapshot, required: false, description: Explicit optional backend snapshot with its own barrier; not implied by unifiedControl or settings. }

  CastSessionCapability:
    kind: object
    description: Capability descriptor for cast.session.
    fields:
      - id: 0x01
        name: protocols
        type: array
        array:
          item_type: string
        required: true
        description: Cast protocol paths represented by the receiver.
      - id: 0x02
        name: receiverPhases
        type: array
        array:
          item_type: string
        required: true
        description: Supported protocol-neutral receiver phases.
      - id: 0x03
        name: supportsAirPlayName
        type: bool
        required: false
        default: true
        description: Whether AirPlay display name query and update are supported.
      - id: 0x04
        name: supportsStopSession
        type: bool
        required: false
        default: true
        description: Whether active cast sessions can be stopped through cast.stopSession.
      - id: 0x05
        name: backendTypes
        type: array
        array:
          item_type: string
        required: false
        description: Backend implementations represented by this receiver.

  CastAudioCapability:
    kind: object
    description: Capability descriptor for cast.audio.
    fields:
      - id: 0x01
        name: defaultEnabled
        type: bool
        required: false
        default: false
        description: Default local playback enablement for received cast audio.
      - id: 0x02
        name: supportsMute
        type: bool
        required: false
        default: true
        description: Whether local mute state can be controlled separately.
      - id: 0x03
        name: reportsEffectivePlayback
        type: bool
        required: false
        default: true
        description: Whether the receiver reports effective local playback state.
      - id: 0x04
        name: supportsAudioDelay
        type: bool
        required: false
        default: true
        description: Whether receiver-local audio playback delay compensation can be configured.
      - id: 0x05
        name: defaultAudioDelayMs
        type: uint32
        required: false
        min: 0
        max: 1000
        default: 250
        description: Default receiver-local audio playback delay in milliseconds.
      - id: 0x06
        name: maxAudioDelayMs
        type: uint32
        required: false
        min: 0
        default: 1000
        description: Maximum supported receiver-local audio playback delay in milliseconds.

  CastPinCodeCapability:
    kind: object
    description: Capability descriptor for cast.pinCode.
    fields:
      - id: 0x01
        name: defaultEnabled
        type: bool
        required: false
        default: true
        description: Whether PIN protection is enabled by default.
      - id: 0x02
        name: supportsPlaintextResponse
        type: bool
        required: false
        default: true
        description: Whether authorized responses or events may carry plaintext PIN values.
      - id: 0x03
        name: supportedPinDisplays
        type: array
        array:
          item_type: string
        required: false
        description: PIN display policies supported by the receiver.
      - id: 0x04
        name: supportsGeneratedPin
        type: bool
        required: false
        default: true
        description: Whether the receiver can generate a default PIN.
      - id: 0x05
        name: redactionRequired
        type: bool
        required: false
        default: true
        description: Whether logs, diagnostics, and error summaries must redact PIN values.

  CastWindowCapability:
    kind: object
    description: Capability descriptor for cast.window.
    fields:
      - id: 0x01
        name: supportsFullscreen
        type: bool
        required: false
        default: true
        description: Whether fullscreen window mode is supported.
      - id: 0x02
        name: supportsAlwaysOnTop
        type: bool
        required: false
        default: true
        description: Whether topmost window state is supported.
      - id: 0x03
        name: supportsNormalRestore
        type: bool
        required: false
        default: true
        description: Whether normal mode can restore remembered normal-mode bounds.
      - id: 0x04
        name: noWindowPolicy
        type: enum
        required: false
        enum: [reject, remember, runtimeDefault]
        description: Receiver policy when a window command is received without an active cast window.

  CastBackendCapability:
    kind: object
    description: Capability descriptor for cast.backend.
    fields:
      - id: 0x01
        name: backendTypes
        type: array
        array:
          item_type: string
        required: true
        description: Backend implementations controlled by the receiver.
      - id: 0x02
        name: supportsRestart
        type: bool
        required: false
        default: true
        description: Whether cast.restartBackend is supported.
      - id: 0x03
        name: reportsProcess
        type: bool
        required: false
        default: true
        description: Whether backend process metadata such as pid may be reported.
      - id: 0x04
        name: supportsLastError
        type: bool
        required: false
        default: true
        description: Whether last backend error summaries are available.

  CastFlowControlCapability:
    kind: object
    description: Capability descriptor for cast.flowControl.
    fields:
      - id: 0x01
        name: supportsRenderFps
        type: bool
        required: false
        default: true
        description: Whether receiver-local target render fps can be controlled.
      - id: 0x02
        name: supportsQueuePolicy
        type: bool
        required: false
        default: true
        description: Whether queue and late-frame policy can be controlled.
      - id: 0x03
        name: supportsOverlay
        type: bool
        required: false
        default: true
        description: Whether diagnostics overlay can be controlled.
      - id: 0x04
        name: supportsStats
        type: bool
        required: false
        default: true
        description: Whether low-frequency flow diagnostics are reported.
      - id: 0x05
        name: exposesExternalKeyframeRequest
        type: bool
        required: false
        default: false
        description: Whether a public keyframe request method is exposed; current draft keeps this false.
      - id: 0x06
        name: supportsVideoStreamParams
        type: bool
        required: false
        default: false
        description: Whether cast.setVideoStreamParams can update source video frame rate or bitrate.
      - id: 0x07
        name: supportsActiveVideoReconfigure
        type: bool
        required: false
        default: false
        description: Whether active video stream parameter changes may reconfigure or replace the current stream.
      - id: 0x08
        name: supportedVideoStreamProfiles
        type: array
        array:
          item_type: string
        required: false
        description: Video STREAM profiles supported by cast.setVideoStreamParams; each profile may declare source-specific support and frame-rate/bitrate ranges.
      - id: 0x09
        name: supportedVideoEncoders
        type: array
        array:
          item_type: string
        required: false
        description: Encoder or encoder profile identifiers exposed for source video reconfiguration.
      - id: 0x0A
        name: supportsSourceSpecificVideoParams
        type: bool
        required: false
        default: true
        description: Whether video parameter support and ranges may vary by source and are described by the selected video profile.

  CastStatusCapability:
    kind: object
    description: Capability descriptor for cast.status snapshot query.
    fields:
      - id: 0x01
        name: sections
        type: array
        array:
          item_type: string
        required: true
        description: Status snapshot sections the receiver can report; v1 adds unifiedControl, controlSync, receivers, sessions, presentation and audioPolicy and reuses window; P1 adds explicitly requested presentationSettings.
      - id: 0x02
        name: supportsSensitiveRedaction
        type: bool
        required: false
        default: true
        description: Whether sensitive status fields can be withheld and marked redacted.
      - id: 0x03
        name: supportedControlVersions
        type: array
        array: { item_type: uint32 }
        required: false
        description: Explicit supported multi-control versions; absence is unknown rather than v1 support.
      - id: 0x04
        name: supportsAtomicUnifiedSnapshot
        type: bool
        required: false
        description: Whether unifiedControl is captured atomically in full; absence is not a verified false or true value.

  CastSessionRef:
    kind: object
    description: Shared runtime session identity, distinct from a protocol-local legacy sessionId.
    fields:
      - { id: 0x01, name: id, type: string, required: true, max_length: 128, description: Nonempty opaque shared runtime session ID. }
      - { id: 0x02, name: generation, type: string, required: true, max_length: 20, description: 'Canonical decimal uint64 string (0 or nonzero-leading digits, at most 18446744073709551615); encoded as UTF-8 in TLV.' }

  CastControlTarget:
    kind: object
    description: Exact presentation fences; params.runtimeInstanceId completes the target and all fences are rechecked atomically at mutation.
    fields:
      - { id: 0x01, name: session, type: CastSessionRef, required: true, description: Shared runtime session and generation. }
      - { id: 0x02, name: slotId, type: uint32, required: true, description: Opaque slot identifier; never an array index. }
      - { id: 0x03, name: bindingGeneration, type: string, required: true, max_length: 20, description: Canonical decimal uint64 string fencing slot reuse. }
      - { id: 0x04, name: lifecycleGeneration, type: string, required: true, max_length: 20, description: Canonical decimal uint64 string fencing presentation lifecycle replacement. }

  CastControlSnapshotCursor:
    kind: object
    description: One atomic logical capture and its complete published-event barrier; counters never wrap within an epoch.
    fields:
      - { id: 0x01, name: controlVersion, type: uint32, required: true, description: Selected control version; P0 uses 1. }
      - { id: 0x02, name: runtimeInstanceId, type: string, required: true, max_length: 36, description: Canonical lower-case UUID text; fresh for each host start. }
      - { id: 0x03, name: revision, type: string, required: true, max_length: 20, description: Canonical decimal uint64 logical control revision. }
      - { id: 0x04, name: eventSequence, type: string, required: true, max_length: 20, description: Canonical decimal uint64 string; snapshot includes every complete published batch through this barrier. }

  CastControlEventContext:
    kind: object
    description: Atomic feature commit group context; all parts share epoch/version/revision/batchId/partCount.
    fields:
      - { id: 0x01, name: controlVersion, type: uint32, required: true, description: Selected control version; P0 uses 1. }
      - { id: 0x02, name: runtimeInstanceId, type: string, required: true, max_length: 36, description: Canonical lower-case UUID identifying the current host epoch. }
      - { id: 0x03, name: revision, type: string, required: true, max_length: 20, description: Canonical decimal uint64 control revision; operation-only batches may retain the current revision. }
      - { id: 0x04, name: eventSequence, type: string, required: true, max_length: 20, description: Canonical decimal uint64 string equal to batchId plus partIndex. }
      - { id: 0x05, name: batchId, type: string, required: true, max_length: 20, description: Canonical decimal uint64 string equal to the first eventSequence of the group. }
      - { id: 0x06, name: partIndex, type: uint32, required: true, description: Zero-based part index strictly less than partCount. }
      - { id: 0x07, name: partCount, type: uint32, required: true, min: 1, description: Positive complete group size; clients apply only after every part is present. }

  CastControlCapabilities:
    kind: object
    description: Dynamic optional multi-control surface; partial descriptors do not imply complete v1 support. No secrets.
    fields:
      - { id: 0x01, name: supportedControlVersions, type: array, array: { item_type: uint32 }, required: true, description: Explicit supported control versions. }
      - { id: 0x02, name: runtimeInstanceId, type: string, required: true, max_length: 36, description: Canonical lower-case UUID for this host lifetime. }
      - { id: 0x03, name: methods, type: array, array: { item_type: string }, required: true, description: Actual registered method names supported by this instance. }
      - { id: 0x04, name: events, type: array, array: { item_type: string }, required: true, description: Actual feature event names supported by this instance. }
      - { id: 0x05, name: statusSections, type: array, array: { item_type: string }, required: true, description: Actual supported status section names. }
      - { id: 0x06, name: presentation, type: CastPresentationCapability, required: false, description: Required when cast.presentation is supported. }
      - { id: 0x07, name: audioPolicy, type: CastAudioPolicyCapability, required: false, description: Required when cast.audioPolicy is supported. }
      - { id: 0x08, name: operations, type: CastControlOperationsCapability, required: false, description: Required when cast.controlOperations is supported. }
      - { id: 0x09, name: profileHints, type: array, array: { item_type: string }, required: false, description: Non-secret host profile hints; not media profiles or implicit defaults. }
      - { id: 0x0A, name: presentationSettings, type: CastPresentationSettingsCapability, required: false, description: Required iff P1 is supported together with its method/event/status section; absence does not imply support. }

      - { id: 0x0B, name: webcastBackend, type: CastWebCastBackendCapability, required: false, description: Required iff this independent backend method/event/status section is supported. }

  CastPresentationCapability:
    kind: object
    description: Supported presentation protocols and logical capture/target guarantees; no product layout algorithm.
    fields:
      - { id: 0x01, name: protocols, type: array, array: { item_type: string }, required: true, description: Supported subset of hid/airplay/webcast; unknown is not a supported protocol. }
      - { id: 0x02, name: supportsAtomicSnapshot, type: bool, required: true, description: Must be true for a complete v1 unifiedControl implementation. }
      - { id: 0x03, name: supportsStrictTargets, type: bool, required: true, description: Must be true for exact per-presentation writes. }
      - { id: 0x04, name: maxPresentationCapacity, type: uint32, required: true, min: 1, description: Positive host-specific presentation capacity bound. }
      - { id: 0x05, name: capacityChoices, type: array, array: { item_type: uint32 }, required: false, description: Positive supported capacities no greater than maxPresentationCapacity. }
      - { id: 0x06, name: layoutModes, type: array, array: { item_type: string }, required: true, description: Supported layout identifiers; geometry remains host-owned. }

  CastAudioPolicyCapability:
    kind: object
    description: Audio intent and effective-set reporting guarantees.
    fields:
      - { id: 0x01, name: controlModes, type: array, array: { item_type: string }, required: true, description: Supported subset of automatic/manual. }
      - { id: 0x02, name: mixModes, type: array, array: { item_type: string }, required: true, description: Supported subset of exclusive/mix. }
      - { id: 0x03, name: supportsPerSessionEnable, type: bool, required: true, description: Whether explicit per-session enabled intent is available. }
      - { id: 0x04, name: reportsEffectiveSet, type: bool, required: true, description: Whether effective participants are reported separately from selected intent. }

  CastControlOperationsCapability:
    kind: object
    description: Query and deduplication guarantees bounded by declared limits.
    fields:
      - { id: 0x01, name: supportsQuery, type: bool, required: true, description: Whether original command results can be queried. }
      - { id: 0x02, name: supportsDedup, type: bool, required: true, description: Whether same-key same-value commands return the original operation. }
      - { id: 0x03, name: limits, type: CastControlLimits, required: true, description: Nonzero finite bounds; guaranteed records cannot be silently evicted. }

  CastControlLimits:
    kind: object
    description: Instance-specific positive uint32 limits; admission reserves result storage and returns BUSY on saturation.
    fields:
      - { id: 0x01, name: maxPendingOperations, type: uint32, required: true, min: 1, description: Maximum globally pending admitted operations. }
      - { id: 0x02, name: maxPendingPerClient, type: uint32, required: true, min: 1, description: Maximum pending operations for one client instance. }
      - { id: 0x03, name: maxRetainedResults, type: uint32, required: true, min: 1, description: Maximum retained records including reserved pending results. }
      - { id: 0x04, name: replayWindowMs, type: uint32, required: true, min: 1, description: Guaranteed dedup/result window from admission using host monotonic time; pending records survive until terminal. }
      - { id: 0x05, name: maxEventBufferEvents, type: uint32, required: true, min: 1, description: Bounded event count used for initial sync and slow-client handling. }
      - { id: 0x06, name: maxEventBufferBytes, type: uint32, required: true, min: 1, description: Bounded buffered event bytes. }
      - { id: 0x07, name: maxRequestBytes, type: uint32, required: true, min: 1, description: Maximum admitted request bytes. }
      - { id: 0x08, name: maxSnapshotBytes, type: uint32, required: true, min: 1, description: Maximum atomic snapshot bytes including bounded collections. }

  CastReceiverState:
    kind: object
    description: Real receiver availability; historical lastError does not override current state. No secrets.
    fields:
      - { id: 0x01, name: receiverId, type: string, required: true, max_length: 128, description: Nonempty opaque receiver identity. }
      - { id: 0x02, name: protocol, type: enum, enum: [hid, airplay, webcast, unknown], required: true, description: Actual receiver protocol; unknown is not a supported-path alias. }
      - { id: 0x03, name: state, type: enum, enum: [disabled, starting, ready, degraded, stopping, failed], required: true, description: Current receiver availability independent of session media. }
      - { id: 0x04, name: observedAt, type: string, required: true, max_length: 64, description: UTC RFC3339 observation time for display only. }
      - { id: 0x05, name: displayName, type: string, required: false, max_length: 128, description: Safe user-visible name; not identity or secret material. }
      - { id: 0x06, name: lastError, type: CastLastError, required: false, description: Historical redacted error summary; never passwords/tokens/SDP/ICE/private keys. }

  CastMultiSessionState:
    kind: object
    description: Current shared runtime session with independent connection, eligibility and media facts.
    fields:
      - { id: 0x01, name: session, type: CastSessionRef, required: true, description: Shared runtime session reference. }
      - { id: 0x02, name: receiverId, type: string, required: true, max_length: 128, description: Nonempty reference to a receiver in the same projection. }
      - { id: 0x03, name: protocol, type: enum, enum: [hid, airplay, webcast, unknown], required: true, description: Actual session protocol; legacy enums remain unchanged. }
      - { id: 0x04, name: receiverState, type: enum, enum: [opening, open, mediaStarting, mediaActive, stopping, closed, failed], required: true, description: Protocol receiver session state; no frames does not imply disconnection. }
      - { id: 0x05, name: presentationEligibility, type: enum, enum: [notEligible, priming, mediaReady, presented, withdrawing, notPresented], required: true, description: Presentation eligibility distinct from authentication and connection. }
      - { id: 0x06, name: videoTrackOpen, type: bool, required: true, description: Whether the video track is open; not proof of rendered frames. }
      - { id: 0x07, name: audioTrackOpen, type: bool, required: true, description: Whether the audio track is open; not proof of audible output. }
      - { id: 0x08, name: audioReadiness, type: enum, enum: [unknown, absent, priming, ready, recovering], required: false, description: Audio readiness when observed. }
      - { id: 0x09, name: displayName, type: string, required: false, max_length: 128, description: Safe user-visible name; not a target identity. }

  CastPresentationSlotState:
    kind: object
    description: Current slot binding; target is required iff occupied and must match this slot and current lifecycle.
    fields:
      - { id: 0x01, name: slotId, type: uint32, required: true, description: Unique slot identifier within the presentation. }
      - { id: 0x02, name: bindingGeneration, type: string, required: true, max_length: 20, description: Canonical decimal uint64 slot-binding generation. }
      - { id: 0x03, name: occupied, type: bool, required: true, description: Whether the slot currently has an exact target. }
      - { id: 0x04, name: target, type: CastControlTarget, required: false, description: Required iff occupied; omitted otherwise; null is invalid. }

  CastPresentationState:
    kind: object
    description: Atomically captured presentation lifecycle, capacity and slots; zero effective/applied capacity does not imply no media.
    fields:
      - { id: 0x01, name: started, type: bool, required: true, description: Whether the presentation lifecycle is started. }
      - { id: 0x02, name: lifecycleGeneration, type: string, required: true, max_length: 20, description: Canonical decimal uint64 lifecycle generation. }
      - { id: 0x03, name: configuredCapacity, type: uint32, required: true, min: 1, description: Positive configured capacity. }
      - { id: 0x04, name: validationAvailable, type: bool, required: true, description: Whether validatedCapacity is currently known. }
      - { id: 0x05, name: validatedCapacity, type: uint32, required: false, min: 1, description: Required iff validationAvailable; omitted when unknown. }
      - { id: 0x06, name: effectiveCapacity, type: uint32, required: true, description: Current host capacity-policy result; may be zero. }
      - { id: 0x07, name: appliedCapacity, type: uint32, required: true, description: Capacity currently applied to presentation; may be zero. }
      - { id: 0x08, name: layoutMode, type: string, required: true, max_length: 64, description: One of the layout identifiers advertised by this instance. }
      - { id: 0x09, name: layoutSettling, type: bool, required: true, description: Whether the host reports layout settling. }
      - { id: 0x0A, name: slots, type: array, array: { item_type: CastPresentationSlotState }, required: true, description: Full bounded current slot set with no removed-session ghost binding. }

  CastAudioPolicyState:
    kind: object
    description: Selected intent and effective audio participation captured with the same session/slot projection.
    fields:
      - { id: 0x01, name: controlMode, type: enum, enum: [automatic, manual], required: true, description: Current control policy; writes do not implicitly reset it. }
      - { id: 0x02, name: mixMode, type: enum, enum: [exclusive, mix], required: true, description: Current mixing policy. }
      - { id: 0x03, name: enabledSessions, type: array, array: { item_type: CastSessionRef }, required: true, description: Unique current session references with enabled intent. }
      - { id: 0x04, name: effectiveAudioSessions, type: array, array: { item_type: CastSessionRef }, required: true, description: Unique current effective participants; neither set proves human-audible sound. }

  CastStopPresentationParams:
    kind: object
    description: One exact withdrawal intent; same runtime/client/command key deduplicates canonical parsed values.
    fields:
      - { id: 0x01, name: controlVersion, type: uint32, required: true, description: Explicit selected control version; P0 uses 1. }
      - { id: 0x02, name: runtimeInstanceId, type: string, required: true, max_length: 36, description: Canonical lower-case UUID of the targeted runtime epoch. }
      - { id: 0x03, name: clientInstanceId, type: string, required: true, max_length: 36, description: Canonical lower-case client UUID; not authorization. }
      - { id: 0x04, name: commandId, type: string, required: true, max_length: 36, description: Canonical lower-case UUID identifying one user intent. }
      - { id: 0x05, name: target, type: CastControlTarget, required: true, description: Original exact target checked atomically at mutation after admission. }
      - { id: 0x06, name: reason, type: string, required: false, max_length: 64, description: Optional non-secret withdrawal reason. }

  CastSetSessionAudioEnabledParams:
    kind: object
    description: One explicit audio enable intent for an exact presentation; no toggle semantics.
    fields:
      - { id: 0x01, name: controlVersion, type: uint32, required: true, description: Explicit selected control version; P0 uses 1. }
      - { id: 0x02, name: runtimeInstanceId, type: string, required: true, max_length: 36, description: Canonical lower-case UUID of the targeted runtime epoch. }
      - { id: 0x03, name: clientInstanceId, type: string, required: true, max_length: 36, description: Canonical lower-case client UUID; not authorization. }
      - { id: 0x04, name: commandId, type: string, required: true, max_length: 36, description: Canonical lower-case UUID identifying one user intent. }
      - { id: 0x05, name: target, type: CastControlTarget, required: true, description: Original exact target checked atomically at mutation. }
      - { id: 0x06, name: enabled, type: bool, required: true, description: Explicit desired intent; applied does not imply effective playback. }

  CastGetControlOperationParams:
    kind: object
    description: Original deduplication key query; missing history is unknown outcome.
    fields:
      - { id: 0x01, name: controlVersion, type: uint32, required: true, description: Explicit selected control version; P0 uses 1. }
      - { id: 0x02, name: runtimeInstanceId, type: string, required: true, max_length: 36, description: Canonical lower-case UUID of the original runtime epoch. }
      - { id: 0x03, name: clientInstanceId, type: string, required: true, max_length: 36, description: Original canonical lower-case client UUID. }
      - { id: 0x04, name: commandId, type: string, required: true, max_length: 36, description: Original canonical lower-case command UUID. }

  CastControlOperation:
    kind: object
    description: Admitted queued or immutable terminal operation; terminal requires completedAt/statusCode/outcomeReason, P0 commit requires appliedRevision and P1 requires settingsResult.
    fields:
      - { id: 0x01, name: operationId, type: string, required: true, max_length: 128, description: Nonempty opaque operation record ID; not media session identity. }
      - { id: 0x02, name: runtimeInstanceId, type: string, required: true, max_length: 36, description: Canonical lower-case runtime epoch UUID. }
      - { id: 0x03, name: clientInstanceId, type: string, required: true, max_length: 36, description: Canonical lower-case UUID of the submitting client. }
      - { id: 0x04, name: commandId, type: string, required: true, max_length: 36, description: Canonical lower-case original intent UUID. }
      - { id: 0x05, name: kind, type: enum, enum: [stopPresentation, setSessionAudioEnabled, setPresentationSettings], required: true, description: Intent kind; settings is a global P1 operation with settingsResult and no presentation target. }
      - { id: 0x06, name: state, type: enum, enum: [queued, applied, rejected, failed], required: true, description: Admission or truthful terminal result; queued is not media success. }
      - { id: 0x07, name: submittedAt, type: string, required: true, max_length: 64, description: UTC RFC3339 submission display time; expiry uses host monotonic time. }
      - { id: 0x08, name: target, type: CastControlTarget, required: false, description: Required for both P0 per-session kinds and retains the original exact target; omitted for P1 settings. }
      - { id: 0x09, name: completedAt, type: string, required: false, max_length: 64, description: UTC RFC3339 time required for applied/rejected/failed. }
      - { id: 0x0A, name: appliedRevision, type: string, required: false, max_length: 20, description: Canonical decimal uint64 string required iff a P0 logical control commit occurred; settings-only metadata uses settingsResult.settingsRevision instead. }
      - { id: 0x0B, name: statusCode, type: uint32, required: false, description: Required terminal standard AXTP status code; applied uses SUCCESS and failures use non-success. }
      - { id: 0x0C, name: outcomeReason, type: string, required: false, max_length: 64, description: Required terminal bounded business reason; not a new numeric error space and never secret data. }
      - { id: 0x0D, name: ownerCleanup, type: enum, enum: [notApplicable, pending, complete, failed], required: false, description: Cleanup observation at terminalization for the target owner only; not entire receiver exit. }
      - { id: 0x0E, name: settingsResult, type: CastPresentationSettingsOperationResult, required: false, description: Required for kind=setPresentationSettings including queued/rejected/failed; reports configuration/application/persistence separately. }

  CastSetPresentationSettingsParams:
    kind: object
    description: Global one-field settings intent; same-key dedup precedes owner-side optimistic version comparison and persist never saves another temporary field.
    fields:
      - { id: 0x01, name: controlVersion, type: uint32, required: true, description: Selected control version; P1 uses 1 with separate capability. }
      - { id: 0x02, name: runtimeInstanceId, type: string, required: true, max_length: 36, description: Canonical lower-case runtime UUID; no automatic replay into a new epoch. }
      - { id: 0x03, name: clientInstanceId, type: string, required: true, max_length: 36, description: Canonical lower-case client UUID; not authorization. }
      - { id: 0x04, name: commandId, type: string, required: true, max_length: 36, description: Canonical lower-case UUID for this explicit settings intent. }
      - { id: 0x05, name: expectedSettingsRevision, type: string, required: true, max_length: 20, description: Canonical decimal uint64 optimistic version; rechecked after dedup and queueing. }
      - { id: 0x06, name: patch, type: CastPresentationSettingsPatch, required: true, description: Exactly one known supported setting key; empty/multiple/unknown keys are INVALID_ARGUMENT. }
      - { id: 0x07, name: persist, type: bool, required: true, description: Explicit save choice; true saves only the patch field before configuration commit and live apply. }

  CastPresentationSettingsPatch:
    kind: object
    description: All fields optional structurally but exactly one key required semantically; unknown patch keys rejected and conditional choices come from capability.
    fields:
      - { id: 0x01, name: layoutMode, type: string, required: false, max_length: 64, description: Nonempty declared layout identifier. }
      - { id: 0x02, name: audioControlMode, type: enum, enum: [automatic, manual], required: false, description: Declared audio control mode; same confirmed value does not reset selection. }
      - { id: 0x03, name: audioMixMode, type: enum, enum: [exclusive, mix], required: false, description: Declared audio mix mode; no implicit inverse-mode rollback. }
      - { id: 0x04, name: capacity, type: uint32, required: false, min: 1, description: One declared capacity choice; no global product maximum or default. }
      - { id: 0x05, name: enabledProtocols, type: array, array: { item_type: string }, required: false, description: Duplicate-free set from declared hid/airplay/webcast protocols; empty only when minEnabledProtocols is explicitly zero. }
      - { id: 0x06, name: profileHint, type: string, required: false, max_length: 64, description: Nonempty declared opaque product profile identifier; not a wire profile. }

  CastPresentationSettingsValues:
    kind: object
    description: Supported setting values only; configured/known persisted projections are complete, while unconfirmed applied fields are absent with issues.
    fields:
      - { id: 0x01, name: layoutMode, type: string, required: false, max_length: 64, description: Declared layout policy identifier. }
      - { id: 0x02, name: audioControlMode, type: enum, enum: [automatic, manual], required: false, description: Adopted or desired control policy; not proof of sound. }
      - { id: 0x03, name: audioMixMode, type: enum, enum: [exclusive, mix], required: false, description: Adopted or desired audio mixing policy. }
      - { id: 0x04, name: capacity, type: uint32, required: false, min: 1, description: Desired capacity or actually adopted capacity according to containing projection; applied may be limited. }
      - { id: 0x05, name: enabledProtocols, type: array, array: { item_type: string }, required: false, description: Adopted or desired enable policy; not receiver readiness. }
      - { id: 0x06, name: profileHint, type: string, required: false, max_length: 64, description: Declared product combination profile identifier. }

  CastPresentationStartupSettings:
    kind: object
    description: Exactly the capability-declared restart-only intent accepted at this host startup; distinct from effective/applied limits and stored values.
    fields:
      - { id: 0x01, name: layoutMode, type: string, required: false, max_length: 64, description: Present only if this implementation declares layoutMode restart-only. }
      - { id: 0x02, name: audioControlMode, type: enum, enum: [automatic, manual], required: false, description: Present only if audioControlMode is restart-only. }
      - { id: 0x03, name: audioMixMode, type: enum, enum: [exclusive, mix], required: false, description: Present only if audioMixMode is restart-only. }
      - { id: 0x04, name: capacity, type: uint32, required: false, min: 1, description: Startup accepted capacity intent before runtime validation limitations. }
      - { id: 0x05, name: enabledProtocols, type: array, array: { item_type: string }, required: false, description: Startup accepted receiver enable policy; does not claim Ready. }
      - { id: 0x06, name: profileHint, type: string, required: false, max_length: 64, description: Startup accepted product profile when declared restart-only. }

  CastPresentationSettingsState:
    kind: object
    description: Full bounded settings state; desired/adopted/startup/stored facts and two independent event barriers must never be conflated.
    fields:
      - { id: 0x01, name: settingsRevision, type: string, required: true, max_length: 20, description: Canonical decimal uint64 settings fact version within the runtime epoch. }
      - { id: 0x02, name: settingsEventSequence, type: string, required: true, max_length: 20, description: Canonical decimal uint64 settings publication barrier; independent of P0 eventSequence. }
      - { id: 0x03, name: configured, type: CastPresentationSettingsValues, required: true, description: Complete supported desired settings including temporary changes. }
      - { id: 0x04, name: applied, type: CastPresentationSettingsValues, required: true, description: Confirmed actually adopted values; unconfirmed fields omitted with issues. }
      - { id: 0x05, name: activeStartup, type: CastPresentationStartupSettings, required: true, description: Restart-only intent accepted at current startup; used to compute pendingRestart. }
      - { id: 0x06, name: pendingRestart, type: array, array: { item_type: string }, required: true, description: Unique restart-only fields where configured differs from activeStartup; applied capacity limits do not create permanent pending. }
      - { id: 0x07, name: persisted, type: bool, required: true, description: True iff desired settings equal known stored/startup projection; false if unknown and not a disk-write receipt. }
      - { id: 0x08, name: unsavedFields, type: array, array: { item_type: string }, required: true, description: Configured fields differing from known stored values; all supported fields when storage projection unknown. }
      - { id: 0x09, name: unappliedFields, type: array, array: { item_type: string }, required: true, description: Live fields differing from confirmed adopted policy; layout animation alone does not qualify. }
      - { id: 0x0A, name: storageState, type: enum, enum: [absent, loaded, saved, invalid, unavailable], required: true, description: Truthful store observation; invalid/unknown files are preserved rather than silently overwritten. }
      - { id: 0x0B, name: lockedFields, type: array, array: { item_type: string }, required: true, description: Unique supported field names currently locked by explicit deployment/authorization policy. }
      - { id: 0x0C, name: applicationIssues, type: array, array: { item_type: CastPresentationSettingIssue }, required: true, description: Safe field-specific limitation/failure/lock observations. }
      - { id: 0x0D, name: persistedValues, type: CastPresentationSettingsValues, required: false, description: Complete known persistent startup projection; omitted if invalid/unavailable/unknown. }
      - { id: 0x0E, name: storeRevision, type: string, required: false, max_length: 20, description: Canonical decimal uint64 known valid store version; absent without valid file. }
      - { id: 0x0F, name: appliedControlRevision, type: string, required: false, max_length: 20, description: Associated P0 adopted-policy revision lower bound for cross-stream synchronization. }
      - { id: 0x10, name: persistError, type: string, required: false, max_length: 512, description: Sanitized bounded storage diagnostic; no raw request/secret/private path. }

  CastPresentationSettingIssue:
    kind: object
    description: One safe supported-field observation; historical failure and current policy remain distinct.
    fields:
      - { id: 0x01, name: field, type: string, required: true, max_length: 64, description: One supported setting field name. }
      - { id: 0x02, name: kind, type: enum, enum: [limitedByValidation, limitedByHardLimit, liveApplyFailed, startupFailed, locked, unknown], required: true, description: Structured limitation/failure classification. }
      - { id: 0x03, name: reason, type: string, required: false, max_length: 128, description: Bounded sanitized reason; no secret/path leakage. }
      - { id: 0x04, name: statusCode, type: uint32, required: false, description: Optional standard AXTP numeric status. }

  CastPresentationSettingsCapability:
    kind: object
    description: Optional P1 field and effect partition; conditional choices/modes/minimum are required for corresponding supported keys, never inferred defaults.
    fields:
      - { id: 0x01, name: fields, type: array, array: { item_type: string }, required: true, description: Unique supported subset of the six settings keys. }
      - { id: 0x02, name: liveFields, type: array, array: { item_type: string }, required: true, description: Live effect subset; disjoint from restartOnlyFields and together exactly fields. }
      - { id: 0x03, name: restartOnlyFields, type: array, array: { item_type: string }, required: true, description: Restart-only subset; updates never automatically restart current media. }
      - { id: 0x04, name: supportsPersistence, type: bool, required: true, description: Whether explicit field-only save requests are supported. }
      - { id: 0x05, name: capacityChoices, type: array, array: { item_type: uint32 }, required: false, description: Nonempty unique positive choices required when capacity supported. }
      - { id: 0x06, name: layoutModes, type: array, array: { item_type: string }, required: false, description: Nonempty unique bounded mode identifiers required when layoutMode supported. }
      - { id: 0x07, name: profileHints, type: array, array: { item_type: string }, required: false, description: Nonempty unique bounded product profile identifiers required when profileHint supported. }
      - { id: 0x08, name: minEnabledProtocols, type: uint32, required: false, description: Required when enabledProtocols supported; zero explicitly permits empty if control/settings can remain available independently. }

  CastPresentationSettingsOperationResult:
    kind: object
    description: Truthful independent configuration/application/persistence results; failed may still include stored/configured commits.
    fields:
      - { id: 0x01, name: field, type: string, required: true, max_length: 64, description: Unique requested setting field. }
      - { id: 0x02, name: settingsRevision, type: string, required: true, max_length: 20, description: Canonical decimal uint64 most recently confirmed settings revision; terminal uses completion/check version. }
      - { id: 0x03, name: configurationStatus, type: enum, enum: [notCommitted, unchanged, committed], required: true, description: Whether this intent changed desired configuration. }
      - { id: 0x04, name: applicationStatus, type: enum, enum: [notAttempted, unchanged, applied, pendingRestart, failed], required: true, description: Confirmed policy adoption or deferred restart intent; not media audibility/restart proof. }
      - { id: 0x05, name: persistenceStatus, type: enum, enum: [notRequested, pending, unchanged, stored, failed], required: true, description: Explicit field-only storage outcome distinct from equality with known persistedValues. }
      - { id: 0x06, name: appliedControlRevision, type: string, required: false, max_length: 20, description: Optional canonical decimal uint64 associated P0 policy revision. }

  CastSettingsEventContext:
    kind: object
    description: Independent settings event cursor; payload revision/sequence must match and this event never consumes P0 sequence.
    fields:
      - { id: 0x01, name: controlVersion, type: uint32, required: true, description: Selected control version; P1 uses 1. }
      - { id: 0x02, name: runtimeInstanceId, type: string, required: true, max_length: 36, description: Canonical lower-case runtime epoch UUID. }
      - { id: 0x03, name: settingsRevision, type: string, required: true, max_length: 20, description: Canonical decimal uint64 settings state version. }
      - { id: 0x04, name: settingsEventSequence, type: string, required: true, max_length: 20, description: Canonical decimal uint64 settings publication sequence; snapshot barrier may be zero. }

  CastPresentationSettingsChangedEvent:
    kind: object
    description: Complete settings state replacement in its own bounded ordered event stream; no P0 context or batch fields.
    fields:
      - { id: 0x01, name: settingsContext, type: CastSettingsEventContext, required: true, description: Independent required settings cursor matching payload versions. }
      - { id: 0x02, name: settings, type: CastPresentationSettingsState, required: true, description: Full post-commit settings state, not a patch. }

  CastReceiversChangedEvent:
    kind: object
    description: Full receiver-section replacement in one control group part.
    fields:
      - { id: 0x01, name: context, type: CastControlEventContext, required: true, description: Required v1 commit context. }
      - { id: 0x02, name: receivers, type: array, array: { item_type: CastReceiverState }, required: true, description: Complete current bounded receiver collection. }

  CastSessionsChangedEvent:
    kind: object
    description: Full session-section replacement in one control group part.
    fields:
      - { id: 0x01, name: context, type: CastControlEventContext, required: true, description: Required v1 commit context. }
      - { id: 0x02, name: sessions, type: array, array: { item_type: CastMultiSessionState }, required: true, description: Complete current bounded session collection. }

  CastPresentationChangedEvent:
    kind: object
    description: Full presentation-section replacement; never a receiver/session/audio aggregate.
    fields:
      - { id: 0x01, name: context, type: CastControlEventContext, required: true, description: Required v1 commit context. }
      - { id: 0x02, name: presentation, type: CastPresentationState, required: true, description: Complete current presentation state. }

  CastAudioPolicyChangedEvent:
    kind: object
    description: Full audio-policy-section replacement in one control group part.
    fields:
      - { id: 0x01, name: context, type: CastControlEventContext, required: true, description: Required v1 commit context. }
      - { id: 0x02, name: audioPolicy, type: CastAudioPolicyState, required: true, description: Complete selected/effective audio policy state. }

  CastControlOperationChangedEvent:
    kind: object
    description: One P0 per-session operation record with ordered control publication context; setPresentationSettings is excluded from this event stream.
    fields:
      - { id: 0x01, name: context, type: CastControlEventContext, required: true, description: Required v1 commit context; may be an operation-only group. }
      - { id: 0x02, name: operation, type: CastControlOperation, required: true, description: One admitted queued or terminal operation record. }

  CastGetWebCastBackendStateParams:
    kind: object
    description: Explicit supported control version for the optional WebCast backend snapshot.
    fields:
      - { id: 0x01, name: controlVersion, type: uint32, required: true, description: Supported control version; this feature uses 1. }

  CastWebCastBackendContext:
    kind: object
    description: Independent full-state event cursor; not part of P0 control or P1 settings sequences.
    fields:
      - { id: 0x01, name: controlVersion, type: uint32, required: true, description: Selected supported control version; uses 1. }
      - { id: 0x02, name: runtimeInstanceId, type: string, required: true, max_length: 36, description: Canonical lower-case host UUID; changes at restart and equals the advertised control epoch. }
      - { id: 0x03, name: backendRevision, type: string, required: true, max_length: 20, description: Canonical decimal uint64 independent backend-state revision. }
      - { id: 0x04, name: backendEventSequence, type: string, required: true, max_length: 20, description: Canonical decimal uint64 barrier covering complete backend replacement events through this snapshot. }

  CastWebCastSignalingState:
    kind: object
    description: Current room signaling availability and retained native peer connectivity; no media-quality claim or secret material.
    fields:
      - { id: 0x01, name: state, type: enum, enum: [disabled, offline, creatingRoom, awaitingRestore, ready, failed, stopped], required: true, description: Ready requires an authoritative usable room and code; transport-open alone is insufficient. }
      - { id: 0x02, name: transportConnected, type: bool, required: true, description: Current signaling transport connectivity independent of existing P2P media. }
      - { id: 0x03, name: retainedPeerCount, type: uint32, required: true, description: Native peers retained by this backend including peers still negotiating. }
      - { id: 0x04, name: connectedPeerCount, type: uint32, required: true, description: Retained peers with an open data/control channel; never proof of presented video or audible output. }
      - { id: 0x05, name: lastNetworkError, type: uint32, required: false, description: Historical sanitized transport error code; not an override of current state. }

  CastWebCastLocalBackendState:
    kind: object
    description: Receiver-owned optional local signaling listener and its independent room.
    fields:
      - { id: 0x01, name: fallbackEnabled, type: bool, required: true, description: Whether local fallback is enabled in the active receiver instance. }
      - { id: 0x02, name: serviceState, type: enum, enum: [disabled, dormant, running, failed, stopped], required: true, description: Local listener lifecycle; dormant means permitted but not yet started. }
      - { id: 0x03, name: servicePort, type: uint32, required: false, min: 1, max: 65535, description: Actual owned listener port in 1..65535; present iff serviceState is running. }
      - { id: 0x04, name: startAttempts, type: string, required: true, max_length: 20, description: Canonical decimal uint64 local-start attempts for this host lifetime. }
      - { id: 0x05, name: lastStartError, type: uint32, required: false, description: Sanitized last local startup error code; no path or exception text. }
      - { id: 0x06, name: signaling, type: CastWebCastSignalingState, required: true, description: Local room signaling and peer connectivity independent of cloud recovery. }

  CastWebCastBackendState:
    kind: object
    description: Actual WebCast signaling backend selection and independent cloud/local observations; no automatic migration or recovery policy is mandated.
    fields:
      - { id: 0x01, name: enabled, type: bool, required: true, description: Whether WebCast was enabled for this host instance; false is reported explicitly. }
      - { id: 0x02, name: state, type: enum, enum: [disabled, starting, ready, failed, stopped], required: true, description: Current ability to admit a new WebCast join; does not describe existing media quality. }
      - { id: 0x03, name: selectedBackend, type: enum, enum: [none, cloud, local], required: true, description: Authoritative backend currently offered for new joins; none when no usable room exists. Existing peers may belong to the other backend. }
      - { id: 0x04, name: cloud, type: CastWebCastSignalingState, required: true, description: Cloud room and peer observations. }
      - { id: 0x05, name: local, type: CastWebCastLocalBackendState, required: true, description: Local listener and room observations; retained local peers need not migrate when cloud returns. }

  CastWebCastBackendSnapshot:
    kind: object
    description: Atomic complete WebCast backend replacement shared by query, optional status section and change event.
    fields:
      - { id: 0x01, name: backendContext, type: CastWebCastBackendContext, required: true, description: Epoch and independent revision/event barrier committed with this state. }
      - { id: 0x02, name: state, type: CastWebCastBackendState, required: true, description: Complete safe backend state rather than a delta. }

  CastWebCastBackendCapability:
    kind: object
    description: Explicit optional WebCast backend snapshot and independent event discovery; absence never implies support.
    fields:
      - { id: 0x01, name: supportsSnapshot, type: bool, required: true, description: True for this complete feature. }
      - { id: 0x02, name: supportsEvents, type: bool, required: true, description: True for complete independent full-state events. }
      - { id: 0x03, name: backendTypes, type: array, array: { item_type: string }, required: true, description: Supported identifiers from cloud and local; current selection is reported separately. }
      - { id: 0x04, name: sequenceModel, type: enum, enum: [independent-full-state], required: true, description: Backend events do not change P0 batch membership or P1 sequence. }


capabilities:
  - id: 0x1601
    name: cast.session
    domain: cast
    status: draft
    since: 1.0.0
    description: Device supports cast receiver session phase, AirPlay name, and session stop control.
    type: object
    schema: CastSessionCapability

  - id: 0x1602
    name: cast.audio
    domain: cast
    status: draft
    since: 1.0.0
    description: Device supports local cast audio playback and mute control.
    type: object
    schema: CastAudioCapability

  - id: 0x1603
    name: cast.pinCode
    domain: cast
    status: draft
    since: 1.0.0
    description: Device supports cast PIN protection, PIN state, and authentication events.
    type: object
    schema: CastPinCodeCapability

  - id: 0x1604
    name: cast.window
    domain: cast
    status: draft
    since: 1.0.0
    description: Device supports cast window state query and mode control.
    type: object
    schema: CastWindowCapability

  - id: 0x1605
    name: cast.backend
    domain: cast
    status: draft
    since: 1.0.0
    description: Device supports cast backend status query and restart control.
    type: object
    schema: CastBackendCapability

  - id: 0x1606
    name: cast.flowControl
    domain: cast
    status: draft
    since: 1.0.0
    description: Device supports receiver-local cast render fps, queue, drop, overlay, and diagnostics control.
    type: object
    schema: CastFlowControlCapability

  - id: 0x1607
    name: cast.status
    domain: cast
    status: draft
    since: 1.0.0
    description: Device supports current cast receiver status snapshot query.
    type: object
    schema: CastStatusCapability

  - id: 0x1608
    name: cast.presentation
    domain: cast
    status: draft
    since: 1.0.0
    description: Optional concurrent receiver/session projection, atomic snapshots and exact presentation targets.
    type: object
    schema: CastPresentationCapability

  - id: 0x1609
    name: cast.audioPolicy
    domain: cast
    status: draft
    since: 1.0.0
    description: Optional explicit per-session audio intent and separate effective participation reporting.
    type: object
    schema: CastAudioPolicyCapability

  - id: 0x160A
    name: cast.controlOperations
    domain: cast
    status: draft
    since: 1.0.0
    description: Optional asynchronous operation query and bounded same-intent deduplication/retention guarantees.
    type: object
    schema: CastControlOperationsCapability

  - id: 0x160B
    name: cast.presentationSettings
    domain: cast
    status: draft
    since: 1.0.0
    description: Optional one-field host settings with declared live/restart behavior, independent synchronization and truthful field-only persistence/application results.
    type: object
    schema: CastPresentationSettingsCapability

  - id: 0x160C
    name: cast.webcastBackend
    domain: cast
    status: draft
    since: 1.0.0
    description: Optional secret-free WebCast cloud/local backend state query and independent full-state changes.
    type: object
    schema: CastWebCastBackendCapability
