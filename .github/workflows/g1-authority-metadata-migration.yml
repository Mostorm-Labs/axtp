name: G1 Authority Metadata Migration

on:
  push:
    branches:
      - chatgpt/axtp-authority-governance-v1
    paths:
      - ".github/workflows/g1-authority-metadata-migration.yml"

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Migrate remaining accepted proposal metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          targets = [
              (
                  Path("workspace/protocol/signage/signage.playlist.md"),
                  "signage",
                  "signage.playlist",
                  "contract/registry/domains/signage/domain.yaml",
              ),
              (
                  Path("workspace/protocol/software/software.config.md"),
                  "software",
                  "software.config",
                  "contract/registry/domains/software/domain.yaml",
              ),
              (
                  Path("workspace/protocol/software/software.updatePolicy.md"),
                  "software",
                  "software.updatePolicy",
                  "contract/registry/domains/software/domain.yaml",
              ),
              (
                  Path("workspace/protocol/stream/stream.flowControl.md"),
                  "stream",
                  "stream.flowControl",
                  "contract/registry/domains/stream/domain.yaml",
              ),
              (
                  Path("workspace/protocol/video/video.stream.md"),
                  "video",
                  "video.stream",
                  "contract/registry/domains/video/domain.yaml",
              ),
          ]

          def split_frontmatter(text: str):
              match = re.match(r"\A---\n([\s\S]*?)\n---\n", text)
              if not match:
                  raise RuntimeError("missing frontmatter")
              return match.group(1), text[match.end():]

          def mask_current_state_rows(body: str):
              lines = body.splitlines(keepends=True)
              counts = {"status": 0, "direct": 0}
              out = []
              for line in lines:
                  if line.startswith("| 当前状态 |"):
                      counts["status"] += 1
                      out.append("| __G1_CURRENT_STATUS__ |\n" if line.endswith("\n") else "| __G1_CURRENT_STATUS__ |")
                  elif line.startswith("| 是否可直接实现 |"):
                      counts["direct"] += 1
                      out.append("| __G1_DIRECT_IMPLEMENTATION__ |\n" if line.endswith("\n") else "| __G1_DIRECT_IMPLEMENTATION__ |")
                  else:
                      out.append(line)
              return "".join(out), counts

          for path, domain, feature, owner in targets:
              original = path.read_text(encoding="utf-8")
              old_frontmatter, body = split_frontmatter(original)

              required_old = [
                  "status: generated",
                  "contract: true",
                  "generated: true",
                  f"domain: {domain}",
                  f"feature: {feature}",
              ]
              missing = [item for item in required_old if item not in old_frontmatter]
              if missing:
                  raise RuntimeError(f"{path}: unexpected legacy frontmatter; missing {missing}")

              masked_before, counts = mask_current_state_rows(body)
              if counts != {"status": 1, "direct": 1}:
                  raise RuntimeError(f"{path}: expected one current-status row and one direct-implementation row, got {counts}")

              new_frontmatter = "\n".join(
                  [
                      "authorityClass: proposal",
                      "lifecycle: accepted",
                      "protocolStability: draft",
                      f"domain: {domain}",
                      f"feature: {feature}",
                      f"adoptedBy: {owner}",
                      "lastReviewed: 2026-08-26",
                  ]
              )

              status_row = (
                  f"| 当前状态 | accepted proposal；canonical facts 已写入 `{owner}` 并生成；"
                  "对应 protocol stability 仍为 draft。 |"
              )
              direct_row = (
                  "| 是否可直接实现 | 否。本文保留设计说明、adoption/review context；"
                  "runtime 必须读取 canonical / generated / conformance authority。 |"
              )

              new_body, n_status = re.subn(r"(?m)^\| 当前状态 \|.*\|$", status_row, body, count=1)
              new_body, n_direct = re.subn(r"(?m)^\| 是否可直接实现 \|.*\|$", direct_row, new_body, count=1)
              if n_status != 1 or n_direct != 1:
                  raise RuntimeError(f"{path}: status row replacement failed")

              masked_after, counts_after = mask_current_state_rows(new_body)
              if counts_after != counts or masked_after != masked_before:
                  raise RuntimeError(f"{path}: body changed outside the two approved current-state rows")

              new_text = f"---\n{new_frontmatter}\n---\n{new_body}"
              parsed_frontmatter, _ = split_frontmatter(new_text)
              for forbidden in ["status:", "contract:", "generated:", "registry:"]:
                  if any(line.startswith(forbidden) for line in parsed_frontmatter.splitlines()):
                      raise RuntimeError(f"{path}: forbidden v1 frontmatter survived: {forbidden}")

              path.write_text(new_text, encoding="utf-8")
              print(f"[OK] migrated {path}")
          PY

          git diff --check -- \
            workspace/protocol/signage/signage.playlist.md \
            workspace/protocol/software/software.config.md \
            workspace/protocol/software/software.updatePolicy.md \
            workspace/protocol/stream/stream.flowControl.md \
            workspace/protocol/video/video.stream.md

          echo "=== Migration diff ==="
          git diff -- \
            workspace/protocol/signage/signage.playlist.md \
            workspace/protocol/software/software.config.md \
            workspace/protocol/software/software.updatePolicy.md \
            workspace/protocol/stream/stream.flowControl.md \
            workspace/protocol/video/video.stream.md

      - name: Commit verified migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            workspace/protocol/signage/signage.playlist.md \
            workspace/protocol/software/software.config.md \
            workspace/protocol/software/software.updatePolicy.md \
            workspace/protocol/stream/stream.flowControl.md \
            workspace/protocol/video/video.stream.md
          git diff --cached --check
          git commit -m "governance: migrate remaining accepted proposal metadata"
          git push origin HEAD:"${GITHUB_REF_NAME}"
