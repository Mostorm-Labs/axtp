name: SEM-LC-08 one-shot patched workflow exporter

on:
  push:
    branches:
      - codex/sem-lc-08-p32-v02
    paths:
      - .github/workflows/sem-lc-08-export-helper.yml

permissions:
  contents: read

jobs:
  export-patched-workflow:
    name: Export exact patched workflow
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Patch exact bytes and verify
        shell: bash
        run: |
          set -euo pipefail
          target=.github/workflows/validate-conformance.yml
          expected_blob=b598148e1eaffa3ac0c70d55a6204861db694327
          test "$(git hash-object "$target")" = "$expected_blob"

          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          path = Path('.github/workflows/validate-conformance.yml')
          data = path.read_bytes()

          old_brace = b"const conflict = run(() => route.registerMigrationBasis({ operationId: 'replay', record: { ...structuredClone(fixture.migration), payload: { changed: true } }));"
          new_brace = b"const conflict = run(() => route.registerMigrationBasis({ operationId: 'replay', record: { ...structuredClone(fixture.migration), payload: { changed: true } } }));"
          if data.count(old_brace) != 1:
              raise SystemExit(f'expected one SEM-LC-05 concurrency syntax defect, found {data.count(old_brace)}')
          data = data.replace(old_brace, new_brace, 1)

          old_pnpm = b"      - name: Build and run SEM-LC-08 reference oracles\n        shell: bash\n        run: |\n          set -euo pipefail\n          pnpm --dir tooling/semantic-lifecycle install --lockfile=false\n          pnpm --dir tooling/semantic-lifecycle build\n"
          new_pnpm = b"      - name: Build and run SEM-LC-08 reference oracles\n        shell: bash\n        run: |\n          set -euo pipefail\n          pnpm --dir tooling/semantic-lifecycle install --lockfile=false\n          export pnpm_config_verify_deps_before_run=false\n          pnpm --dir tooling/semantic-lifecycle build\n"
          if data.count(old_pnpm) != 1:
              raise SystemExit(f'expected one SEM-LC-08 reference build step, found {data.count(old_pnpm)}')
          data = data.replace(old_pnpm, new_pnpm, 1)
          path.write_bytes(data)

          text = data.decode('utf-8')
          marker = '      - name: Materialize complete SEM-LC-05 evidence contract\n'
          section = text.split(marker, 1)[1]
          heredoc = "          node --input-type=module <<'NODE'\n"
          start = section.index(heredoc) + len(heredoc)
          end = section.index('\n          NODE', start)
          script = textwrap.dedent(section[start:end]) + '\n'
          Path('/tmp/sem-lc-05-materialize.mjs').write_text(script, encoding='utf-8')
          PY

          test "$(git diff --name-only)" = "$target"
          test "$(git diff --numstat -- "$target")" = $'2\t1\t.github/workflows/validate-conformance.yml'
          git diff --check -- "$target"
          node --check /tmp/sem-lc-05-materialize.mjs
          corepack enable
          corepack prepare pnpm@11.3.0 --activate
          test "$(env pnpm_config_verify_deps_before_run=false pnpm config get verifyDepsBeforeRun)" = false

          patched_blob="$(git hash-object "$target")"
          printf '%s\n' "$patched_blob" > /tmp/patched-workflow-blob-sha.txt
          printf 'PATCHED_BLOB_SHA=%s\n' "$patched_blob"
          git diff --unified=1 -- "$target"

      - uses: actions/upload-artifact@v4
        with:
          name: sem-lc-08-patched-workflow-${{ github.sha }}
          path: |
            .github/workflows/validate-conformance.yml
            /tmp/patched-workflow-blob-sha.txt
          if-no-files-found: error
          retention-days: 7
