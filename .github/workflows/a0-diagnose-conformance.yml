name: A0 Diagnose Conformance

on:
  push:
    branches:
      - aegis/a0-contract-authority-reconciliation

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout A0 branch
        uses: actions/checkout@v4
        with:
          ref: aegis/a0-contract-authority-reconciliation

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@11.3.0 --activate
          pnpm --dir tooling/generators install --frozen-lockfile

      - name: Capture conformance validator output
        shell: bash
        run: |
          set +e
          tooling/scripts/validate-conformance.sh > .a0-conformance-diagnostic.txt 2>&1
          status=$?
          printf '\nexit_status=%s\n' "$status" >> .a0-conformance-diagnostic.txt
          cat .a0-conformance-diagnostic.txt
          exit 0

      - name: Commit diagnostic output
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .a0-conformance-diagnostic.txt
          git commit -m "chore: capture A0 conformance diagnostic"
          git push origin HEAD:aegis/a0-contract-authority-reconciliation
