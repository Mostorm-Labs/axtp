name: SEM-LC-08 one-shot canonical fixture digest patch helper

on:
  push:
    branches:
      - codex/sem-lc-08-p32-v02
    paths:
      - .github/workflows/sem-lc-08-canonical-fixture-patch-helper.yml

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Patch fixture identity to canonical JSON and run regression
        shell: bash
        run: |
          set -euo pipefail
          core=tooling/semantic-lifecycle/src/semanticLifecycleEvidenceCore.ts
          test_file=tooling/semantic-lifecycle/src/semanticLifecycleReferenceEvidence.test.ts
          test "$(git hash-object "$core")" = 550a0aec76b64d3becf9cd647e9cceb4633892dd
          test "$(git hash-object "$test_file")" = 0f7224b189aa7d8caa7abc1e8f756588b9c29a96

          python3 - <<'PY'
          from pathlib import Path

          core = Path('tooling/semantic-lifecycle/src/semanticLifecycleEvidenceCore.ts')
          data = core.read_text(encoding='utf-8')
          old = '''function minimalFixtureDigest(): string {\n  return sha256(readFileSync(minimalFixturePath()));\n}\n'''
          new = '''function minimalFixtureDigest(): string {\n  const fixture = JSON.parse(readFileSync(minimalFixturePath(), "utf8")) as unknown;\n  return sha256(canonicalJson(fixture));\n}\n'''
          if data.count(old) != 1:
              raise SystemExit(f'expected one raw fixture digest implementation, found {data.count(old)}')
          core.write_text(data.replace(old, new, 1), encoding='utf-8')

          test_file = Path('tooling/semantic-lifecycle/src/semanticLifecycleReferenceEvidence.test.ts')
          data = test_file.read_text(encoding='utf-8')
          old_fs = 'import { mkdtempSync, rmSync } from "node:fs";'
          new_fs = 'import { mkdtempSync, readFileSync, rmSync } from "node:fs";'
          if data.count(old_fs) != 1:
              raise SystemExit('reference test fs import drift')
          data = data.replace(old_fs, new_fs, 1)
          old_core = 'import { buildReferenceBundle, compareUtf8UnsignedBytes, permutationIds } from "./semanticLifecycleEvidenceCore.js";'
          new_core = 'import { buildReferenceBundle, canonicalJson, compareUtf8UnsignedBytes, permutationIds, sha256 } from "./semanticLifecycleEvidenceCore.js";'
          if data.count(old_core) != 1:
              raise SystemExit('reference test core import drift')
          data = data.replace(old_core, new_core, 1)
          marker = '''test("UTF-8 unsigned-byte ordering is normalization-free", () => {\n'''
          regression = '''test("fixture identity is canonical JSON rather than checkout text bytes", () => {\n  const bundle = buildReferenceBundle({ resultRevision, resultTree, platform: "ubuntu-latest" });\n  const fixture = JSON.parse(readFileSync(join("fixtures", "sem-lc-08", "minimal-reference.json"), "utf8"));\n  assert.equal(bundle.fixture_sha256, sha256(canonicalJson(fixture)));\n});\n\n'''
          if data.count(marker) != 1:
              raise SystemExit('reference test insertion marker drift')
          data = data.replace(marker, regression + marker, 1)
          test_file.write_text(data, encoding='utf-8')
          PY

          test "$(git diff --name-only | LC_ALL=C sort)" = $'tooling/semantic-lifecycle/src/semanticLifecycleEvidenceCore.ts\ntooling/semantic-lifecycle/src/semanticLifecycleReferenceEvidence.test.ts'
          git diff --check -- "$core" "$test_file"
          corepack enable
          corepack prepare pnpm@11.3.0 --activate
          pnpm --dir tooling/semantic-lifecycle install --lockfile=false
          export pnpm_config_verify_deps_before_run=false
          pnpm --dir tooling/semantic-lifecycle build
          pnpm --dir tooling/semantic-lifecycle lint
          pnpm --dir tooling/semantic-lifecycle test:semantic-lifecycle:reference
          pnpm --dir tooling/semantic-lifecycle test:semantic-lifecycle:portable
          pnpm --dir tooling/semantic-lifecycle test
          git diff --unified=3 -- "$core" "$test_file"

      - name: Commit exact source fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- tooling/semantic-lifecycle/src/semanticLifecycleEvidenceCore.ts tooling/semantic-lifecycle/src/semanticLifecycleReferenceEvidence.test.ts
          test "$(git diff --cached --name-only | LC_ALL=C sort)" = $'tooling/semantic-lifecycle/src/semanticLifecycleEvidenceCore.ts\ntooling/semantic-lifecycle/src/semanticLifecycleReferenceEvidence.test.ts'
          git commit -m 'SEM-LC-08: canonicalize fixture identity digest'
          git push origin "HEAD:codex/sem-lc-08-p32-v02"
