name: P36 Isolated Materialization

on:
  push:
    branches:
      - aegis/p36-materialization-snapshot

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: aegis/p36-materialization-snapshot
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@11.3.0 --activate
          pnpm --dir tooling/generators install --frozen-lockfile

      - name: Apply frozen P23 materialization
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/p36_materialize.py

      - name: Generate and verify P36 tree
        shell: bash
        run: |
          set -euo pipefail
          pnpm --dir tooling/generators build
          pnpm --dir tooling/generators generate
          pnpm --dir tooling/generators exec vitest run -u
          pnpm --dir tooling/generators test
          pnpm --dir tooling/generators lint
          pnpm --dir tooling/generators validate
          pnpm --dir tooling/generators validate:sources
          pnpm --dir tooling/generators validate:protocol
          tooling/scripts/check-generated-drift.sh
          tooling/scripts/validate-conformance.sh
          tooling/scripts/check-links.mjs
          node tooling/scripts/check-text-paths.mjs
          node tooling/scripts/check-frontstage-language.mjs
          node tooling/scripts/check-draft-noise.mjs
          tooling/scripts/check-protocol-status.mjs
          node tooling/scripts/report-protocol-draft-health.mjs --check docs/product/protocol-draft-health.md
          tooling/scripts/check-release-artifact.sh 0.0.0

      - name: Materialize verified tree on snapshot branch
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/p36-materialize.yml .github/p36_materialize.py
          git add -A
          if git diff --cached --name-only | grep -E '(^|/)(runtime|axtp-(cpp|ts|python|c|flutter)-runtime)(/|$)|AXTP_SPEC\.lock\.yaml'; then
            echo 'Forbidden runtime scope detected' >&2
            exit 1
          fi
          git diff --cached --check
          git config user.name 'aegis-p36'
          git config user.email 'aegis-p36@users.noreply.github.com'
          git commit -m 'fix: materialize P23 core framing contract'
          git push origin HEAD:aegis/p36-materialization-snapshot
