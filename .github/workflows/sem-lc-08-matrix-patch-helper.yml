name: SEM-LC-08 one-shot matrix patch helper

on:
  push:
    branches:
      - codex/sem-lc-08-p32-v02
    paths:
      - .github/workflows/sem-lc-08-matrix-patch-helper.yml

permissions:
  contents: write

jobs:
  stage-patched-blob:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Patch exact reference-matrix command only
        shell: bash
        run: |
          set -euo pipefail
          target=.github/workflows/validate-conformance.yml
          expected_blob=d294f5483bf10f212cd7764d7f39219b767a5cf7
          test "$(git hash-object "$target")" = "$expected_blob"
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/validate-conformance.yml')
          data = path.read_bytes()
          old = b'''          pnpm --dir tooling/semantic-lifecycle build\n          pnpm --dir tooling/semantic-lifecycle lint\n          pnpm --dir tooling/semantic-lifecycle test\n          pnpm --dir tooling/semantic-lifecycle test:semantic-lifecycle:reference\n          pnpm --dir tooling/semantic-lifecycle test:semantic-lifecycle:portable\n'''
          new = b'''          pnpm --dir tooling/semantic-lifecycle build\n          pnpm --dir tooling/semantic-lifecycle lint\n          if [ "${{ matrix.os }}" = "ubuntu-latest" ]; then\n            pnpm --dir tooling/semantic-lifecycle test\n          fi\n          pnpm --dir tooling/semantic-lifecycle test:semantic-lifecycle:reference\n          pnpm --dir tooling/semantic-lifecycle test:semantic-lifecycle:portable\n'''
          count = data.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly one SEM-LC-08 reference block, found {count}')
          path.write_bytes(data.replace(old, new, 1))
          PY
          test "$(git diff --name-only)" = "$target"
          test "$(git diff --numstat -- "$target")" = $'3\t1\t.github/workflows/validate-conformance.yml'
          git diff --check -- "$target"
          grep -Fq 'if [ "${{ matrix.os }}" = "ubuntu-latest" ]; then' "$target"
          git diff --unified=2 -- "$target"
          patched_blob="$(git hash-object "$target")"
          printf '%s\n' "$patched_blob" > /tmp/patched-blob-sha
          transport=.aegis/tmp/sem-lc-08-matrix-workflow.blob
          mkdir -p "$(dirname "$transport")"
          cp "$target" "$transport"
          test "$(git hash-object "$transport")" = "$patched_blob"
          git checkout -- "$target"
          test "$(git hash-object "$target")" = "$expected_blob"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- "$transport"
          test "$(git diff --cached --name-only)" = "$transport"
          git commit -m 'SEM-LC-08: stage matrix workflow blob transport'
          git push origin "HEAD:codex/sem-lc-08-p32-v02"
          echo "PATCHED_BLOB_SHA=$patched_blob"
