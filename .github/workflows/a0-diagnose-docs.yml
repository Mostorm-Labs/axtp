name: A0 Diagnose Docs

on:
  push:
    branches:
      - aegis/a0-contract-authority-reconciliation

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout A0 branch
        uses: actions/checkout@v4
        with:
          ref: aegis/a0-contract-authority-reconciliation

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Capture docs validator output
        shell: bash
        run: |
          set +e
          : > .a0-docs-diagnostic.txt
          run_check() {
            label="$1"
            shift
            printf '\n=== %s ===\n' "$label" >> .a0-docs-diagnostic.txt
            "$@" >> .a0-docs-diagnostic.txt 2>&1
            status=$?
            printf 'exit_status=%s\n' "$status" >> .a0-docs-diagnostic.txt
          }
          run_check check-links tooling/scripts/check-links.mjs
          run_check check-text-paths node tooling/scripts/check-text-paths.mjs
          run_check check-frontstage-language node tooling/scripts/check-frontstage-language.mjs
          run_check check-draft-noise node tooling/scripts/check-draft-noise.mjs
          run_check check-protocol-status tooling/scripts/check-protocol-status.mjs
          run_check report-protocol-draft-health node tooling/scripts/report-protocol-draft-health.mjs --check docs/product/protocol-draft-health.md
          cat .a0-docs-diagnostic.txt

      - name: Commit diagnostic output
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .a0-docs-diagnostic.txt
          git commit -m "chore: capture A0 docs diagnostic"
          git push origin HEAD:aegis/a0-contract-authority-reconciliation
