name: G1 Authority Preflight

on:
  push:
    branches:
      - chatgpt/axtp-authority-governance-v1
    paths:
      - ".github/workflows/g1-authority-preflight.yml"

permissions:
  contents: write

jobs:
  authority-preflight:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Refresh derived proposal health report
        shell: bash
        run: |
          set -euo pipefail
          node tooling/scripts/report-protocol-draft-health.mjs --write docs/product/protocol-draft-health.md
          changed="$(git diff --name-only)"
          if [ "$changed" != "docs/product/protocol-draft-health.md" ]; then
            echo "Unexpected derived changes:"
            printf '%s\n' "$changed"
            exit 1
          fi

      - name: Validate proposal authority and documentation
        shell: bash
        run: |
          set -euo pipefail
          node --check tooling/scripts/check-protocol-status.mjs
          node --check tooling/scripts/report-protocol-draft-health.mjs
          tooling/scripts/check-links.mjs
          node tooling/scripts/check-text-paths.mjs
          node tooling/scripts/check-frontstage-language.mjs
          node tooling/scripts/check-draft-noise.mjs
          tooling/scripts/check-protocol-status.mjs
          node tooling/scripts/report-protocol-draft-health.mjs --check docs/product/protocol-draft-health.md
          git diff --check

      - name: Commit derived health report
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- docs/product/protocol-draft-health.md; then
            echo "Health report already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/product/protocol-draft-health.md
          git diff --cached --check
          git commit -m "docs: refresh protocol proposal health report"
          git push origin HEAD:"${GITHUB_REF_NAME}"
