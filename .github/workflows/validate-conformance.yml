          const context = { exactSource: { sourceRef: process.env.SOURCE_SHA, sourceTree: process.env.SOURCE_TREE, taskAnchor: process.env.TASK_ANCHOR }, implementationRelease: { notionPageId: '3d04c57a-590c-814d-9f9a-df6bfe38bd02', githubComment: 5527601747 }, predecessor: { taskId: 'AXTP-SEM-LC-02', state: 'REPOSITORY_INTEGRATION_CLOSED', mergeCommit: process.env.TASK_ANCHOR }, authorityContract: { packageRef: 'AXTP-SEM-LC-03-P31-v0.1@40fa88a1d52df7e9f8251f0f7247b87f04409be0' }, authorityRefs: [first.authority.authorityRef, second.authority.authorityRef, left.authority.authorityRef, independentResult.authority.authorityRef], candidateRefs: [firstCandidate.candidate.candidateRef, secondCandidate.candidate.candidateRef, leftCandidate.candidate.candidateRef, rightCandidate.candidate.candidateRef], reviewIds: [firstCandidate.review.reviewId, secondCandidate.review.reviewId, leftCandidate.review.reviewId, rightCandidate.review.reviewId], fixtureCaseIds: { authority: authorityFixtureIds, concurrency: concurrencyFixtureIds }, c3EvidenceManifest: ['C3-T1', 'C3-T2', 'C3-T3', 'C3-T4', 'C3-T5', 'C3-T6'], deterministicRepeat: { enumerations: 2, byteEqual: true } };
