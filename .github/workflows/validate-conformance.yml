name: Validate AXTP Spec

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate-spec:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout AXTP spec
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@11.3.0 --activate

      - name: Install generator dependencies
        shell: bash
        run: |
          set -euo pipefail
          pnpm --dir tooling/generators install --frozen-lockfile

      - name: Validate generator and generated artifacts
        shell: bash
        run: |
          set -euo pipefail
          pnpm --dir tooling/generators build
          pnpm --dir tooling/generators lint
          pnpm --dir tooling/generators test
          pnpm --dir tooling/generators validate
          pnpm --dir tooling/generators validate:sources
          pnpm --dir tooling/generators validate:protocol
          tooling/scripts/check-generated-drift.sh

      - name: Verify semantic descriptor generated-drift fails closed
        shell: bash
        run: |
          set -euo pipefail
          artifact="contract/generated/semantic.json"
          backup="$(mktemp "${TMPDIR:-/tmp}/axtp-semantic-backup.XXXXXX")"
          cp "$artifact" "$backup"
          restore_artifact() {
            cp "$backup" "$artifact"
            rm -f "$backup"
          }
          trap restore_artifact EXIT

          cat > "$artifact" <<'JSON'
          {
            "descriptorVersion": "0.1",
            "sources": [],
            "tampered": true
          }
          JSON

          if tooling/scripts/check-generated-drift.sh >/tmp/axtp-semantic-negative-drift.log 2>&1; then
            echo "semantic generated drift unexpectedly accepted a tampered artifact" >&2
            exit 1
          fi

          restore_artifact
          trap - EXIT
          tooling/scripts/check-generated-drift.sh

      - name: Validate conformance cases
        shell: bash
        run: tooling/scripts/validate-conformance.sh

      - name: Validate docs and protocol status
        shell: bash
        run: |
          set -euo pipefail
          tooling/scripts/check-links.mjs
          node tooling/scripts/check-text-paths.mjs
          node tooling/scripts/check-frontstage-language.mjs
          node tooling/scripts/check-draft-noise.mjs
          tooling/scripts/check-protocol-status.mjs
          node tooling/scripts/report-protocol-draft-health.mjs --check docs/product/protocol-draft-health.md

      - name: Validate release artifact dry run
        shell: bash
        run: tooling/scripts/check-release-artifact.sh 0.0.0

      - name: Verify semantic descriptor release artifact fails closed
        shell: bash
        run: |
          set -euo pipefail
          artifact="contract/generated/semantic.json"
          archive="dist/axtp-spec-v0.0.0.zip"

          python3 - "$archive" "$artifact" <<'PY'
          import pathlib
          import sys
          import zipfile

          archive_path, artifact_path = sys.argv[1], sys.argv[2]
          expected = pathlib.Path(artifact_path).read_bytes()
          member = f"axtp-spec-v0.0.0/{artifact_path}"
          with zipfile.ZipFile(archive_path) as archive:
              actual = archive.read(member)
          if actual != expected:
              raise SystemExit("release semantic.json bytes differ from committed canonical artifact")
          PY

          backup="$(mktemp "${TMPDIR:-/tmp}/axtp-release-semantic-backup.XXXXXX")"
          cp "$artifact" "$backup"
          restore_artifact() {
            cp "$backup" "$artifact"
            rm -f "$backup"
          }
          trap restore_artifact EXIT

          rm -f "$artifact"
          if tooling/scripts/check-release-artifact.sh 0.0.0 >/tmp/axtp-semantic-negative-release.log 2>&1; then
            echo "release artifact contract unexpectedly accepted missing semantic.json" >&2
            exit 1
          fi

          restore_artifact
          trap - EXIT
          tooling/scripts/check-release-artifact.sh 0.0.0

      - name: Install semantic lifecycle dependencies
        shell: bash
        run: |
          set -euo pipefail
          pnpm --dir tooling/semantic-lifecycle install --lockfile=false

      - name: Validate semantic lifecycle exact source
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          actual_head="$(git rev-parse HEAD)"
          if [ "$actual_head" != "$EXPECTED_HEAD_SHA" ]; then
            echo "semantic lifecycle CI did not checkout exact source: expected=$EXPECTED_HEAD_SHA actual=$actual_head" >&2
            exit 1
          fi
          pnpm --dir tooling/semantic-lifecycle build
          pnpm --dir tooling/semantic-lifecycle lint
          pnpm --dir tooling/semantic-lifecycle test

      - name: Materialize semantic lifecycle exact-source report
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          cd tooling/semantic-lifecycle
          rm -rf .evidence
          mkdir -p .evidence

          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          import { InMemoryLifecycleControlStore } from './.test-dist/src/controlStore.js';
          import { SemanticLifecycleCoordinator } from './.test-dist/src/coordinator.js';
          import { buildClassificationReport, serializeClassificationReport } from './.test-dist/src/report.js';

          const basisRef = Object.freeze({
            refType: 'IMMUTABLE_REVISION',
            namespace: 'classification-policy',
            subject: 'semantic-delta-v1',
            revision: 'policy-a',
            digest: 'sha256:policy-a'
          });

          function fixture(name) {
            return JSON.parse(readFileSync(`fixtures/classification/${name}`, 'utf8'));
          }

          function exactRef(caseId) {
            return Object.freeze({
              refType: 'IMMUTABLE_REVISION',
              namespace: 'semantic-scope',
              subject: caseId,
              revision: `scope:${caseId}`,
              digest: `sha256:${caseId}`
            });
          }

          function proofCase(entry, observations = entry.observations) {
            const coordinator = new SemanticLifecycleCoordinator(new InMemoryLifecycleControlStore());
            const scopeRef = exactRef(entry.id);
            const proof = coordinator.assess({ caseId: entry.id, scopeRef, observations }, basisRef);
            const fastPath = coordinator.evaluateFastPath(proof.assessment, scopeRef, basisRef);
            return {
              caseId: entry.id,
              semanticDimension: entry.changedDimension ?? null,
              expectedDisposition: entry.expected,
              observations,
              proof,
              fastPath
            };
          }

          function buildCorpus(reverse = false) {
            const semantic = fixture('semantic-delta-cases.json');
            const noDelta = fixture('no-delta-cases.json');
            const unresolved = fixture('unresolved-cases.json').filter((entry) => entry.kind === 'CLASSIFICATION');
            const source = [...semantic, ...noDelta, ...unresolved];
            const ordered = reverse ? [...source].reverse() : source;
            return ordered.map((entry) => {
              const observations = reverse
                ? [...entry.observations].reverse().map((observation) => ({
                    ...observation,
                    evidenceRefs: [...observation.evidenceRefs].reverse()
                  }))
                : entry.observations;
              return proofCase(entry, observations);
            });
          }

          function freshnessProbes(cases) {
            const noDeltaCase = cases.find((entry) => entry.expectedDisposition === 'NO_SEMANTIC_DELTA');
            if (!noDeltaCase) throw new Error('NO_DELTA_CASE_MISSING');
            const staleScope = {
              ...noDeltaCase.proof.assessment.scopeRef,
              revision: 'scope:stale',
              digest: 'sha256:stale'
            };
            const staleBasis = {
              ...basisRef,
              revision: 'policy-b',
              digest: 'sha256:policy-b'
            };
            const coordinator = new SemanticLifecycleCoordinator(new InMemoryLifecycleControlStore());
            return [
              {
                probeId: 'stale-scope',
                expectedEligible: false,
                decision: coordinator.evaluateFastPath(noDeltaCase.proof.assessment, staleScope, basisRef)
              },
              {
                probeId: 'stale-classification-basis',
                expectedEligible: false,
                decision: coordinator.evaluateFastPath(
                  noDeltaCase.proof.assessment,
                  noDeltaCase.proof.assessment.scopeRef,
                  staleBasis
                )
              }
            ];
          }

          function render(reverse) {
            const cases = buildCorpus(reverse);
            return serializeClassificationReport(buildClassificationReport(cases, freshnessProbes(cases)));
          }

          const first = render(false);
          const second = render(true);
          if (first !== second) throw new Error('REPORT_NONDETERMINISTIC');

          const report = JSON.parse(first);
          if (report.verdict !== 'PASS') throw new Error(`REPORT_VERDICT_${report.verdict}`);
          if (!report.coverage.complete || report.coverage.coveredSemanticDeltaCategories.length !== 15) {
            throw new Error('REPORT_COVERAGE_INCOMPLETE');
          }
          for (const [name, value] of Object.entries(report.metrics)) {
            if (value !== 0) throw new Error(`NONZERO_METRIC:${name}:${value}`);
          }

          const digest = createHash('sha256').update(first).digest('hex');
          writeFileSync('.evidence/semantic-delta-classification-report.json', first);
          writeFileSync(
            '.evidence/report-base-metadata.json',
            `${JSON.stringify({
              evidenceVersion: 'sem-lc-01-exact-source-evidence/v1',
              proofContractVersion: report.proofContractVersion,
              reportSha256: digest,
              deterministicRepeatEqual: true,
              classificationBasisRef: report.cases[0]?.classificationBasisRef ?? null,
              scopeRefs: report.cases.map((entry) => entry.scopeRef),
              coverage: report.coverage,
              metrics: report.metrics,
              verdict: report.verdict
            }, null, 2)}\n`
          );

          console.log(`SEM_LC_REPORT_SHA256=${digest}`);
          console.log(`SEM_LC_REPORT_VERDICT=${report.verdict}`);
          console.log(`SEM_LC_COVERED_CATEGORIES=${report.coverage.coveredSemanticDeltaCategories.length}`);
          console.log('SEM_LC_DETERMINISTIC_REPEAT=true');
          NODE

          source_sha="$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)"
          source_tree="$(git -C "$GITHUB_WORKSPACE" rev-parse 'HEAD^{tree}')"
          if [ "$source_sha" != "$EXPECTED_HEAD_SHA" ]; then
            echo "report source mismatch: expected=$EXPECTED_HEAD_SHA actual=$source_sha" >&2
            exit 1
          fi
          report_sha="$(sha256sum .evidence/semantic-delta-classification-report.json | awk '{print $1}')"

          SOURCE_SHA="$source_sha" SOURCE_TREE="$source_tree" REPORT_SHA="$report_sha" node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const base = JSON.parse(readFileSync('.evidence/report-base-metadata.json', 'utf8'));
          const metadata = Object.freeze({
            ...base,
            sourceRef: process.env.SOURCE_SHA,
            sourceTree: process.env.SOURCE_TREE,
            exactSourceEquality: true,
            reportSha256: process.env.REPORT_SHA
          });
          writeFileSync('.evidence/exact-source-evidence.json', `${JSON.stringify(metadata, null, 2)}\n`);
          NODE

          printf '%s  %s\n' "$report_sha" semantic-delta-classification-report.json > .evidence/report.sha256
          echo "SEM_LC_SOURCE_SHA=$source_sha"
          echo "SEM_LC_SOURCE_TREE=$source_tree"
          echo "SEM_LC_REPORT_SHA256=$report_sha"

      - name: Reconstruct semantic lifecycle TDD RED-GREEN evidence
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          pkg="$GITHUB_WORKSPACE/tooling/semantic-lifecycle"
          out="$pkg/.evidence/tdd"
          rm -rf "$out"
          mkdir -p "$out"
          tsc_bin="$pkg/node_modules/.bin/tsc"
          node_bin="$(command -v node)"
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT

          compile_red() {
            local group="$1"
            local test_js="$2"
            local impl_file="$3"
            local red_dir="$tmp/${group}-red"
            cp -R "$pkg" "$red_dir"
            rm -rf "$red_dir/dist" "$red_dir/.test-dist" "$red_dir/.evidence" "$red_dir/node_modules"
            rm -f "$red_dir/src/$impl_file"
            local log="$out/${group}-red.txt"
            set +e
            (
              cd "$red_dir"
              "$tsc_bin" --module NodeNext --moduleResolution NodeNext --target ES2022 \
                --outDir .test-dist --rootDir . --skipLibCheck --noEmitOnError false \
                --resolveJsonModule --esModuleInterop src/*.ts
            ) >"$log" 2>&1
            local compile_status=$?
            (
              cd "$red_dir"
              "$node_bin" --test ".test-dist/src/$test_js"
            ) >>"$log" 2>&1
            local test_status=$?
            set -e
            printf '\ncompile_status=%s\ntest_status=%s\nexpected_red=true\n' \
              "$compile_status" "$test_status" >>"$log"
            if [ "$compile_status" -eq 0 ] && [ "$test_status" -eq 0 ]; then
              echo "unexpected green for $group" >&2
              return 1
            fi
          }

          run_green() {
            local group="$1"
            local test_js="$2"
            local log="$out/${group}-green.txt"
            (
              cd "$pkg"
              "$node_bin" --test ".test-dist/src/$test_js"
            ) >"$log" 2>&1
            printf '\ntest_status=0\nexpected_green=true\n' >>"$log"
          }

          compile_red T1 basis.test.js basis.ts
          run_green T1 basis.test.js
          compile_red T2 classification.test.js classification.ts
          run_green T2 classification.test.js
          compile_red T3 freshness.test.js freshness.ts
          run_green T3 freshness.test.js
          compile_red T4 controlStore.test.js controlStore.ts
          run_green T4 controlStore.test.js
          compile_red T5 coordinator.test.js coordinator.ts
          run_green T5 coordinator.test.js
          compile_red T6 report.test.js report.ts
          run_green T6 report.test.js

          t7_dir="$tmp/T7-red"
          cp -R "$pkg" "$t7_dir"
          rm -rf "$t7_dir/dist" "$t7_dir/.test-dist" "$t7_dir/.evidence" "$t7_dir/node_modules"
          T7_FILE="$t7_dir/src/classification.ts" "$node_bin" <<'NODE'
          const fs = require('fs');
          const path = process.env.T7_FILE;
          let text = fs.readFileSync(path, 'utf8');
          const old = `    if (!Array.isArray(observation.evidenceRefs) || rawEvidenceRefs.some((ref) => !isValidEvidenceRef(ref))) {\n      diagnostics.push(\`INVALID_EVIDENCE_REF:\${observation.dimension}\`);\n      invalidEvidence = true;\n    }`;
          if (!text.includes(old)) throw new Error('T7_REPLAY_PATTERN_NOT_FOUND');
          text = text.replace(
            old,
            '    // controlled replay of pre-fix behavior: invalid refs are silently filtered'
          );
          fs.writeFileSync(path, text);
          NODE

          set +e
          (
            cd "$t7_dir"
            "$tsc_bin" --module NodeNext --moduleResolution NodeNext --target ES2022 \
              --outDir .test-dist --rootDir . --skipLibCheck --noEmitOnError false \
              --resolveJsonModule --esModuleInterop src/*.ts
          ) >"$out/T7-red-invalid-evidence.txt" 2>&1
          t7_compile=$?
          (
            cd "$t7_dir"
            "$node_bin" --test .test-dist/src/classification.test.js
          ) >>"$out/T7-red-invalid-evidence.txt" 2>&1
          t7_test=$?
          set -e
          printf '\ncompile_status=%s\ntest_status=%s\nexpected_red=true\n' \
            "$t7_compile" "$t7_test" >>"$out/T7-red-invalid-evidence.txt"
          if [ "$t7_test" -eq 0 ]; then
            echo 'T7 controlled replay unexpectedly green' >&2
            exit 1
          fi
          if ! grep -q 'any invalid EvidenceRef makes an otherwise NO_DELTA case UNRESOLVED' \
            "$out/T7-red-invalid-evidence.txt"; then
            echo 'T7 red transcript does not identify the invalid EvidenceRef regression' >&2
            exit 1
          fi
          (
            cd "$pkg"
            "$node_bin" --test .test-dist/src/classification.test.js
          ) >"$out/T7-green-invalid-evidence.txt" 2>&1
          printf '\ntest_status=0\nexpected_green=true\n' >>"$out/T7-green-invalid-evidence.txt"

          SOURCE_BASIS='7c20d5e720be6746b43037bc341ce53bbea1e7db' \
          SEMANTIC_PATCH_SHA256='7b15287cdca27f6ab44a44f157de2a17d4c823b8cba3dab6e0f46dca2e9d4ec2' \
          REPAIRED_HEAD="$EXPECTED_HEAD_SHA" OUT_DIR="$out" "$node_bin" <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');
          const path = require('path');
          const out = process.env.OUT_DIR;
          const files = fs.readdirSync(out).sort().map((file) => {
            const data = fs.readFileSync(path.join(out, file));
            return {
              file,
              bytes: data.length,
              sha256: crypto.createHash('sha256').update(data).digest('hex')
            };
          });
          const manifest = {
            reportVersion: 'sem-lc-01-tdd-replay-manifest/v1',
            replayMode: 'CONTROLLED_ISOLATED_REPLAY',
            semanticImplementationBasis: process.env.SOURCE_BASIS,
            semanticImplementationPatchSha256: process.env.SEMANTIC_PATCH_SHA256,
            repairedExactHead: process.env.REPAIRED_HEAD,
            finalSemanticSourceModifiedByReplay: false,
            groups: {
              T1: 'missing basis implementation -> exact basis tests RED, final exact source GREEN',
              T2: 'missing classifier implementation -> classification tests RED, final exact source GREEN',
              T3: 'missing freshness implementation -> freshness tests RED, final exact source GREEN',
              T4: 'missing control-store implementation -> store tests RED, final exact source GREEN',
              T5: 'missing coordinator implementation -> coordinator tests RED, final exact source GREEN',
              T6: 'missing report implementation -> report tests RED, final exact source GREEN',
              T7: 'pre-fix invalid-EvidenceRef silent filtering -> regression test RED, fail-closed final source GREEN'
            },
            transcripts: files
          };
          fs.writeFileSync(path.join(out, 'manifest.json'), JSON.stringify(manifest, null, 2) + '\n');
          NODE

          cat "$out/manifest.json"
          sha256sum "$out"/*

      - name: Upload semantic lifecycle exact-source evidence
        uses: actions/upload-artifact@v4
        with:
          name: sem-lc-01-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            tooling/semantic-lifecycle/.evidence/semantic-delta-classification-report.json
            tooling/semantic-lifecycle/.evidence/exact-source-evidence.json
            tooling/semantic-lifecycle/.evidence/report.sha256
            tooling/semantic-lifecycle/.evidence/tdd/*.txt
            tooling/semantic-lifecycle/.evidence/tdd/manifest.json
          if-no-files-found: error
          retention-days: 90

  semantic-descriptor-portability:
    name: Semantic descriptor portability (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - name: Checkout AXTP spec
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@11.3.0 --activate

      - name: Install generator dependencies
        shell: bash
        run: |
          set -euo pipefail
          pnpm --dir tooling/generators install --frozen-lockfile

      - name: Build generator
        shell: bash
        run: |
          set -euo pipefail
          pnpm --dir tooling/generators build

      - name: Run semantic descriptor focused tests
        shell: bash
        run: |
          set -euo pipefail
          pnpm --dir tooling/generators exec vitest run \
            src/semantic/descriptorMaterializer.test.ts \
            src/semantic/descriptorEmitter.test.ts \
            src/semantic/descriptorPipeline.test.ts \
            src/semantic/descriptorCli.test.ts \
            src/semantic/descriptorRepositoryIntegration.test.ts \
            src/semantic/descriptorP36Evidence.test.ts

      - name: Verify semantic descriptor canonical bytes
        shell: bash
        run: |
          set -euo pipefail
          output=".semantic-portability.json"
          node tooling/generators/dist/cli.js generate-semantic \
            --spec . \
            --out "$output"
          node -e "const fs=require('fs'); const expected=fs.readFileSync('contract/generated/semantic.json'); const actual=fs.readFileSync(process.argv[1]); if (!expected.equals(actual)) { console.error('semantic descriptor bytes differ'); process.exit(1); }" "$output"
          rm -f "$output"

  sem-lc-02-evidence:
    name: SEM-LC-02 candidate/review exact-source evidence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup pnpm
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@11.3.0 --activate
      - name: Validate exact source and materialize SEM-LC-02 evidence
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          TASK_ANCHOR: 48aa536f3a0875350cf3c4270aa4f9f7e6ce993e
        run: |
          set -euo pipefail
          root="$GITHUB_WORKSPACE"
          pkg="$root/tooling/semantic-lifecycle"
          out="$pkg/.evidence/sem-lc-02"
          [ "$(git -C "$root" rev-parse HEAD)" = "$EXPECTED_HEAD_SHA" ] || exit 1
          git -C "$root" merge-base --is-ancestor "$TASK_ANCHOR" HEAD
          allow='^(.github/workflows/validate-conformance.yml|tooling/semantic-lifecycle/(fixtures/candidate/(candidate-cases|review-cases)\.json|src/(architectureBoundary\.test|candidateReport(\.test)?|candidateReviewCoordinator(\.test)?|candidateStore(\.test)?|controlStore(\.test)?|index|model|review(\.test)?)\.ts))$'
          while IFS= read -r path; do
            [ -z "$path" ] || printf '%s\n' "$path" | grep -Eq "$allow" || { echo "SEM-LC-02 unauthorized path: $path" >&2; exit 1; }
          done < <(git -C "$root" diff --name-only "$TASK_ANCHOR"...HEAD)
          rm -rf "$out"
          mkdir -p "$out/tdd"
          pnpm --dir "$pkg" install --lockfile=false
          pnpm --dir "$pkg" build
          pnpm --dir "$pkg" lint
          pnpm --dir "$pkg" test
          cd "$pkg"
          node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          import { InMemoryLifecycleControlStore } from './.test-dist/src/controlStore.js';
          import { InMemorySemanticCandidateStore } from './.test-dist/src/candidateStore.js';
          import { CandidateReviewCoordinator } from './.test-dist/src/candidateReviewCoordinator.js';
          import { buildCandidateIsolationReport, serializeCandidateIsolationReport } from './.test-dist/src/candidateReport.js';
          const scopeRef={refType:'IMMUTABLE_REVISION',namespace:'semantic-scope',subject:'case-evidence',revision:'scope-v1',digest:'sha256:scope-v1'};
          const basis={refType:'IMMUTABLE_REVISION',namespace:'classification-policy',subject:'semantic-delta-v1',revision:'policy-a',digest:'sha256:policy-a'};
          const ref1={refType:'IMMUTABLE_REVISION',namespace:'semantic-candidate',subject:'candidate-evidence',revision:'candidate-v1',digest:'sha256:candidate-v1'};
          const ref2={...ref1,revision:'candidate-v2',digest:'sha256:candidate-v2'};
          const controls=new InMemoryLifecycleControlStore(), candidates=new InMemorySemanticCandidateStore(), service=new CandidateReviewCoordinator(controls,candidates);
          controls.putAssessment({assessmentId:'assessment:evidence',caseId:'case-evidence',scopeRef,classificationBasisRef:basis,disposition:'SEMANTIC_DELTA',evaluatedDimensions:['FIELD_MEANING'],evidenceRefs:[{refType:'EVIDENCE',id:'classification'}]});
          const first=service.createCandidate({candidateId:'candidate-evidence',candidateRef:ref1,assessmentId:'assessment:evidence',payload:{meaning:'v1'},evidenceRefs:[{refType:'EVIDENCE',id:'candidate-v1'}]});
          const human={reviewId:'review:v1',reviewKind:'SEMANTIC_CANDIDATE',decisionSource:'HUMAN',verdict:'PASS',candidateRef:ref1,scopeRef,classificationBasisRef:basis,evidenceRefs:[{refType:'EVIDENCE',id:'human-v1'}]};
          service.recordHumanReviewDecision(human);
          if (!service.evaluateHumanReview(human,first).eligible) throw new Error('exact human review rejected');
          const repaired=service.createCandidate({candidateId:'candidate-evidence',candidateRef:ref2,supersedesCandidateRef:ref1,assessmentId:'assessment:evidence',payload:{meaning:'v2'},evidenceRefs:[{refType:'EVIDENCE',id:'candidate-v2'}]});
          if (service.evaluateHumanReview(human,repaired).eligible) throw new Error('stale review accepted');
