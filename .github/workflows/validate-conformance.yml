          [ "$SOURCE_SHA" = "$EXPECTED_HEAD_SHA" ]
          export SOURCE_SHA SOURCE_TREE TASK_ANCHOR
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
