name: Validate AXTP Spec

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate-spec:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout AXTP spec
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@11.3.0 --activate

      - name: Install generator dependencies
        shell: bash
        run: |
          set -euo pipefail
          pnpm --dir tooling/generators install --frozen-lockfile

      - name: Build generator
        shell: bash
        run: pnpm --dir tooling/generators build

      - name: Lint generator
        shell: bash
        run: pnpm --dir tooling/generators lint

      - name: Test authority policy
        shell: bash
        run: pnpm --dir tooling/generators exec vitest run src/authorityPolicy.test.ts

      - name: Test authority surfaces
        shell: bash
        run: pnpm --dir tooling/generators exec vitest run src/authoritySurface.test.ts

      - name: Test protocol validator
        shell: bash
        run: pnpm --dir tooling/generators exec vitest run src/protocolValidator.test.ts

      - name: Test release scripts
        shell: bash
        run: pnpm --dir tooling/generators exec vitest run src/releaseScripts.test.ts

      - name: Test source validator
        shell: bash
        run: pnpm --dir tooling/generators exec vitest run src/validator.test.ts

      - name: Validate generator
        shell: bash
        run: pnpm --dir tooling/generators validate

      - name: Validate generator sources
        shell: bash
        run: pnpm --dir tooling/generators validate:sources

      - name: Validate generated protocol
        shell: bash
        run: pnpm --dir tooling/generators validate:protocol

      - name: Check generated drift
        shell: bash
        run: tooling/scripts/check-generated-drift.sh

      - name: Validate conformance cases
        shell: bash
        run: tooling/scripts/validate-conformance.sh

      - name: Validate docs and protocol status
        shell: bash
        run: |
          set -euo pipefail
          tooling/scripts/check-links.mjs
          node tooling/scripts/check-text-paths.mjs
          node tooling/scripts/check-frontstage-language.mjs
          node tooling/scripts/check-draft-noise.mjs
          tooling/scripts/check-protocol-status.mjs
          node tooling/scripts/report-protocol-draft-health.mjs --check docs/product/protocol-draft-health.md

      - name: Validate release artifact dry run
        shell: bash
        run: tooling/scripts/check-release-artifact.sh 0.0.0
