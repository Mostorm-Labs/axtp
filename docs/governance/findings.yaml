  - id: AXTP-GOV-002
    priority: P0
    gate: G2
    class: GOV-AMBIGUITY
    title: Release, protocol, registry, schema and wire version dimensions use overloaded names
    status: closed
    evidence:
      - docs/governance/reviews/G2-spec-identity.md
      - contract/registry/version.yaml
      - contract/registry/core/protocol_meta.yaml
      - specs/20-core.md
      - specs/50-tooling.md
      - release/README.md
      - release/AXTP_SPEC_VERSIONING.zh-CN.md
      - release/AXTP_SPEC_VERSIONING.md
      - release/AXTP_RUNTIME_SPEC_LOCK.zh-CN.md
      - release/AXTP_RUNTIME_SPEC_LOCK.md
      - release/AXTP_RUNTIME_UPDATE_FLOW.md
      - docs/guides/runtime.md
      - conformance/cases/session/axtp_version_advisory.yaml
    resolution:
      - Canonical SpecIdentity semantics now separate release, protocol-semantics, Standard Frame wire, registry/schema model, authority schema, generator, runtime implementation and Hello advisory dimensions.
      - spec/vX.Y.Z and release/dispatch spec_version are frozen as repository release identity only.
      - protocol.version is classified as protocolSemantics.version; it is not release identity or a generic session gate.
      - Historical protocol.specVersion is classified as a legacy alias of Standard Frame wire generation, consistent with the v1 Core freeze history and Header Version authority.
      - contract/registry/version.yaml version fields are preserved as legacy metadata mirrors rather than promoted into a second compatibility authority.
      - Runtime package-local specVersion fields, where already used, are classified as consumer aliases of release.version and are not the same namespace as Protocol IR protocol.specVersion.
      - Hello.d.axtpVersion remains diagnostic/advisory only, backed by existing conformance coverage.
      - Existing machine fields are not physically renamed in G2; any future rename requires an explicit tooling/schema migration with downstream verification.
      - Full Validate AXTP Spec run 32954862246 passed on G2 functional head a28b7aeba3be8066c500a9c0b2707ee5957aa856; exact-head closure evidence is retained in Draft PR #12 Checks.
    expectedDisposition: Establish explicit SpecIdentity semantics while preserving compatibility aliases where required.

  - id: AXTP-GOV-003
    priority: P0
    gate: G4
    class: DERIVATION-DEFECT
    title: Test-vector emitter hard-codes semantic vectors and binary truth instead of deriving them from SpecModel
    status: closed
    evidence:
      - docs/governance/reviews/G4-derivation-golden-vectors.md
      - contract/vector-recipes/current-core.yaml
      - contract/vector-recipes/historical.yaml
      - contract/test-vectors/manifest.json
      - contract/test-vectors/historical/
      - tooling/generators/src/vectorRecipes.ts
      - tooling/generators/src/vectorEncoding.ts
      - tooling/generators/src/emitters/testVectors.ts
      - tooling/generators/src/vectorRecipes.test.ts
      - tooling/generators/src/vectorEncoding.test.ts
      - tooling/generators/src/validator.test.ts
      - tooling/scripts/check-generated-drift.sh
      - tooling/scripts/build-spec-artifact.sh
      - tooling/release/artifact-contract.json
      - tooling/release/manifest.template.yaml
    resolution:
      - Current-core vector generation now follows semantic recipe -> active protocol source resolution -> narrow deterministic encoder -> generated bytes/digest; the emitter no longer authors current vector IDs, protocol facts or final hex.
      - Current-core recipes contain named semantic fixture inputs and Rule references but do not contain final hex or copied numeric protocol identifiers/schema field IDs.
      - Five pre-G4 current-intent vectors were classified as stale pseudo-golden evidence because they omitted current CRC and/or used obsolete RPC/schema projections; their original bytes are preserved under contract/test-vectors/historical/pre-g4/ while top-level current files are regenerated from current authority.
      - Compact CRC/overflow fixtures are preserved byte-for-byte under contract/test-vectors/historical/compact/ and are no longer counted as AXTP v1 Core golden-vector evidence.
      - The current manifest separates vectors from historicalFixtures and records recipe anchors, Rule references, derivation mode and SHA-256 wire digests.
      - Generated drift recursively compares the entire vector tree, including nested historical evidence.
      - Release artifacts now ship and declare contract/vector-recipes/** alongside generated contract/test-vectors/** so consumers can inspect derivation input and output.
      - Full functional Validate AXTP Spec run 32979904060 passed on head 880e6f717fac6d84edecbfef2910cd9606d5a6ed with 55/55 generator tests, registry/source/Protocol IR validation, recursive generated drift, 39 conformance cases, G3 Rule coverage, docs/status/path checks and release artifact dry run all PASS.
      - The emitter audit discovered separate human-readable protocol projection debt in protocolMarkdown.ts; it is tracked independently as AXTP-GOV-012 for G5 and does not source current-core golden bytes.
      - Exact-head closure evidence is retained in Draft PR #12 Checks after the governance-only closure commits.
    expectedDisposition: Introduce canonical vector recipes and derive current-core bytes from declared authority.

  - id: AXTP-GOV-004
    priority: P1
    gate: G3
    class: VERIFICATION-GAP
    title: Normative requirements lack stable Rule IDs and explicit rule-to-conformance coverage
    status: closed
    evidence:
      - docs/governance/reviews/G3-rule-verification.md
      - contract/rules/rules.yaml
      - contract/rules/README.md
      - conformance/schemas/conformance-case.schema.json
      - conformance/cases/
      - tooling/scripts/lib/rule-coverage.mjs
      - tooling/scripts/rule-coverage.test.mjs
      - tooling/scripts/validate-rule-coverage.mjs
      - tooling/scripts/validate-conformance.sh
    resolution:
      - Seeded 11 stable current-core Rule IDs covering frame identity, CONTROL, RPC session/compatibility/method/event behavior, codec forward compatibility, STREAM header shape and Endpoint Relay addressing.
      - Existing specs remain semantic authority; the Rule registry provides stable verification metadata and source pointers without redefining protocol behavior.
      - Case authorityRules is the single authored Rule-to-Case edge; reverse Rule-to-Case coverage is derived by tooling rather than duplicated in the Rule registry.
      - Ten seeded rules use executable covered disposition; CORE.FRAME.001 explicitly uses structural-only evidence because the current conformance DSL does not inject invalid raw Standard Frame versions.
      - Coverage validation rejects unknown Rule references, covered rules without cases, malformed evidence/dispositions, and any seeded stable MUST rule left uncovered.
      - Existing selected conformance cases retain their original executable steps/assertions; only authorityRules metadata was added.
      - Pure coverage helper completed an isolated RED-to-GREEN node:test cycle with 3/3 passing tests.
      - Full Validate AXTP Spec run 32957936731 passed on G3 functional head acdb83555e2a5758d762978d971dbf688eecafb9.
      - The full run reported 11 normative rules, covered=10, structural-only=1, uncovered=0; 39 conformance cases; 45 generator tests; generated drift, docs/status and release artifact dry run all PASS.
      - Exact-head closure evidence is retained in Draft PR #12 Checks after the closure-record commits.
    expectedDisposition: Seed stable Rule IDs and bidirectional Rule-to-Evidence traceability.

