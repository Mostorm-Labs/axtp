findings:
  - id: AXTP-GOV-001
    priority: P0
    gate: G1
    class: GOV-AMBIGUITY
    title: Workspace proposals can claim runtime contract authority
    status: closed
    evidence:
      - workspace/protocol/README.md
      - workspace/protocol/draft-conventions.md
      - tooling/skills/20-draft-business-protocol/references/protocol-draft-template.md
      - tooling/scripts/check-protocol-status.mjs
      - docs/governance/reviews/G1-authority-boundary.md
    resolution:
      - Authority Metadata v2 fixes the authoring source so workspace/protocol always remains proposal authority.
      - All 21 active accepted/generated proposals that previously claimed contract:true have been migrated to proposal authority metadata and scalar canonical adoptedBy links.
      - Targeted G1 authority preflight 32951426806 passed.
      - Full Validate AXTP Spec run 32952949759 passed on the corrected functional state; exact-head closure evidence is retained in Draft PR #12 Checks.
    expectedDisposition: Remove contract authority from workspace and link accepted proposals to canonical adoption targets.

