  - id: AXTP-GOV-011
    priority: P1
    gate: G1
    class: GOV-AMBIGUITY
    title: Generated lifecycle wording and protocol stability wording are mixed across artifacts
    status: closed
    evidence:
      - workspace/protocol/README.md
      - workspace/protocol/draft-conventions.md
      - tooling/skills/20-draft-business-protocol/references/protocol-draft-template.md
      - tooling/skills/30-adopt-protocol-draft/SKILL.md
      - tooling/skills/40-amend-adopted-protocol/SKILL.md
      - tooling/scripts/report-protocol-draft-health.mjs
      - docs/governance/reviews/G1-authority-boundary.md
    resolution:
      - Proposal lifecycle and protocol stability are now separate fields with independent enumerations.
      - Accepted proposals preserve the canonical Registry fact stability instead of treating generated/adopted state as stable.
      - Proposal health reporting now separates Accepted proposal from Generated facts.
      - Targeted G1 authority preflight 32951426806 passed.
      - Full Validate AXTP Spec run 32952949759 passed on the corrected functional state; exact-head closure evidence is retained in Draft PR #12 Checks.
    expectedDisposition: Separate artifact lifecycle from protocol fact stability and eliminate overloaded status interpretation.
