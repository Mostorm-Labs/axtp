  - id: AXTP-GOV-012
    priority: P1
    gate: G5
    class: DERIVATION-DEFECT
    title: Generated human protocol Markdown embeds independent protocol facts outside ProtocolModel projection
    status: closed
    evidence:
      - tooling/generators/src/emitters/protocolMarkdown.ts
      - tooling/generators/src/protocolProjectionFacts.ts
      - tooling/generators/src/protocolMarkdown.test.ts
      - contract/registry/core/rpc_op.yaml
      - specs/20-core.md
      - contract/generated/protocol.md
      - contract/generated/README.md
      - github://Mostorm-Labs/axtp/actions/runs/33020869297
    observed:
      - Protocol Markdown previously embedded the Standard Frame header byte count and selected JSON RPC op numbers as emitter literals.
      - G5 derives those projection facts from canonical rpc_op.yaml and the normative Standard Frame field table without extending Protocol IR.
      - Remaining fixed explanatory prose is explicitly non-authoritative reading guidance and cannot override Registry, specs, Protocol IR, Rule or conformance authority.
    resolution:
      - Numeric/layout protocol facts suitable for deterministic projection are loaded fail-closed through ProtocolProjectionFacts rather than authored as emitter literals.
      - Fixed explanatory template prose is separated from protocol facts by the generated-directory authority contract in contract/generated/README.md.
      - Full Validate AXTP Spec run 33020869297 completed success on exact functional head 04559cd4df33dfbaa25f7c87f5b90baabf776e10 with 56/56 generator tests, including the protocol Markdown authority-boundary mutation test.
      - Source/Protocol IR validation and generated drift passed, proving the derivation repair preserves current generated output while removing independent numeric ownership from the emitter.
    expectedDisposition: Refactor generated human-readable framework/opcode prose to model-driven projections or explicitly separate non-authoritative explanatory template text from protocol facts.
